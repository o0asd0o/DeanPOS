<text x="40" y="34" font-size="17" font-weight="bold" fill="#111">Back-office · Employees</text>
<text x="40" y="56" font-size="12" fill="#555">backoffice · desktop 1440x900 · lo-fi: structure and order only — spacing, type, colour and states come from tokens</text>
<g transform="translate(40,78)">
<rect x="0" y="0" width="1440" height="900" fill="#ffffff" stroke="#111" stroke-width="2"/>
<rect x="0" y="0" width="240" height="900" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1"/><text x="16" y="34" font-size="15" text-anchor="start" font-weight="bold" fill="#111">DeanPOS</text><rect x="12" y="64" width="216" height="28" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1"/><text x="22" y="82.0" font-size="12" fill="#111">Reports</text><rect x="26" y="98" width="202" height="28" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1"/><text x="36" y="115.66666666666667" font-size="11" fill="#111">▫  Summary</text><rect x="26" y="132" width="202" height="28" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1"/><text x="36" y="149.66666666666666" font-size="11" fill="#111">▫  Orders</text><rect x="26" y="166" width="202" height="28" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1"/><text x="36" y="183.66666666666666" font-size="11" fill="#111">▫  By item</text><rect x="26" y="200" width="202" height="28" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1"/><text x="36" y="217.66666666666666" font-size="11" fill="#111">▫  By category</text><rect x="26" y="234" width="202" height="28" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1"/><text x="36" y="251.66666666666666" font-size="11" fill="#111">▫  By cashier</text><rect x="26" y="268" width="202" height="28" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1"/><text x="36" y="285.6666666666667" font-size="11" fill="#111">▫  By payment method</text><rect x="26" y="302" width="202" height="28" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1"/><text x="36" y="319.6666666666667" font-size="11" fill="#111">▫  Discounts &amp; overrides</text><rect x="26" y="336" width="202" height="28" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1"/><text x="36" y="353.6666666666667" font-size="11" fill="#111">▫  Refunds</text><rect x="12" y="370" width="216" height="28" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1"/><text x="22" y="388.0" font-size="12" fill="#111">Operations</text><rect x="26" y="404" width="202" height="28" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1"/><text x="36" y="421.6666666666667" font-size="11" fill="#111">▫  Drawer sessions</text><rect x="26" y="438" width="202" height="28" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1"/><text x="36" y="455.6666666666667" font-size="11" fill="#111">▫  Catalog</text><rect x="26" y="472" width="202" height="28" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1"/><text x="36" y="489.6666666666667" font-size="11" fill="#111">▫  Add-ons</text><rect x="26" y="506" width="202" height="28" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1"/><text x="36" y="523.6666666666666" font-size="11" fill="#111">▫  Discounts</text><rect x="26" y="540" width="202" height="28" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1"/><text x="36" y="557.6666666666666" font-size="11" fill="#111">▫  Availability</text><rect x="12" y="574" width="216" height="28" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1"/><text x="22" y="592.0" font-size="12" fill="#111">Administration</text><rect x="26" y="608" width="202" height="28" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1"/><text x="36" y="625.6666666666666" font-size="11" fill="#111">▫  Stores</text><rect x="26" y="642" width="202" height="28" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1"/><text x="36" y="659.6666666666666" font-size="11" fill="#111">▫  Devices</text><rect x="26" y="676" width="202" height="28" rx="0" fill="#cccccc" stroke="#333" stroke-width="1"/><text x="36" y="693.6666666666666" font-size="11" fill="#111">▫  Employees</text><rect x="26" y="710" width="202" height="28" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1"/><text x="36" y="727.6666666666666" font-size="11" fill="#111">▫  Roster</text><rect x="26" y="744" width="202" height="28" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1"/><text x="36" y="761.6666666666666" font-size="11" fill="#111">▫  Quarantine</text><text x="264" y="50" font-size="15" text-anchor="start" font-weight="bold" fill="#111">Hi Jomel</text><rect x="576.0" y="18" width="288" height="44" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="586.0" y="44.0" font-size="12" fill="#111">Search…                          ⌘K</text><rect x="1320" y="18" width="44" height="44" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="1342.0" y="43.666666666666664" font-size="11" text-anchor="middle" fill="#111">bell</text><rect x="1372" y="18" width="44" height="44" rx="0" fill="#eeeeee" stroke="#333" stroke-width="1"/><text x="1394.0" y="44.0" font-size="12" text-anchor="middle" fill="#111">JO</text><line x1="264" y1="80" x2="1416" y2="80" stroke="#333"/><text x="1416" y="74" font-size="12" text-anchor="end" font-weight="normal" fill="#111"></text><text x="264" y="132" font-size="20" text-anchor="start" font-weight="bold" fill="#111">Employees</text><text x="264" y="156" font-size="12" text-anchor="start" font-weight="normal" fill="#111">Who can sign in, what they may do, and where they work.</text><rect x="1236" y="112" width="180" height="48" rx="0" fill="#cccccc" stroke="#333" stroke-width="1"/><text x="1326.0" y="140.33333333333334" font-size="13" text-anchor="middle" fill="#111">+ Add employee</text><rect x="264" y="184" width="1152" height="480" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="280" y="214" font-size="11" text-anchor="start" font-weight="normal" fill="#111">Status</text><rect x="280" y="222" width="330" height="46" rx="0" fill="#eeeeee" stroke="#333" stroke-width="1"/><text x="445.0" y="249.0" font-size="12" text-anchor="middle" fill="#111">(  All  ) ( Active ) ( Deactivated )</text><text x="1112" y="214" font-size="11" text-anchor="start" font-weight="normal" fill="#111">Search employees</text><rect x="1112" y="222" width="288" height="46" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="1122" y="248.66666666666666" font-size="11" fill="#111">e.g. Juana dela Cruz                    ⌕</text><rect x="280" y="290" width="1120" height="44" rx="0" fill="#eeeeee" stroke="#333" stroke-width="1"/><text x="290" y="316.0" font-size="12" text-anchor="start" font-weight="bold" fill="#111">NAME ▲</text><text x="510" y="316.0" font-size="12" text-anchor="start" font-weight="bold" fill="#111">EMAIL</text><text x="750" y="316.0" font-size="12" text-anchor="start" font-weight="bold" fill="#111">ROLE</text><text x="870" y="316.0" font-size="12" text-anchor="start" font-weight="bold" fill="#111">STORES</text><text x="1080" y="316.0" font-size="12" text-anchor="start" font-weight="bold" fill="#111">STATUS</text><text x="1200" y="316.0" font-size="12" text-anchor="start" font-weight="bold" fill="#111"></text><rect x="280" y="334" width="1120" height="44" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="290" y="360.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">Ana Reyes</text><text x="510" y="360.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">ana@nena.test</text><text x="750" y="360.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">Cashier</text><text x="870" y="360.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">Malabon</text><text x="1080" y="360.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">[Active]</text><text x="1200" y="360.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">✎ Edit    ⏻ Deactivate</text><rect x="280" y="378" width="1120" height="44" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="290" y="404.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">Boy Santos</text><text x="510" y="404.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">boy@nena.test</text><text x="750" y="404.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">Manager</text><text x="870" y="404.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">Malabon, Cubao</text><text x="1080" y="404.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">[Active]</text><text x="1200" y="404.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">✎ Edit    ⏻ Deactivate</text><rect x="280" y="422" width="1120" height="44" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="290" y="448.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">Cris Dela Cruz</text><text x="510" y="448.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">cris@nena.test</text><text x="750" y="448.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">Cashier</text><text x="870" y="448.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">None</text><text x="1080" y="448.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">[Active]</text><text x="1200" y="448.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">✎ Edit    ⏻ Deactivate</text><rect x="280" y="466" width="1120" height="44" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="290" y="492.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">Dina Lim</text><text x="510" y="492.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">dina@nena.test</text><text x="750" y="492.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">Cashier</text><text x="870" y="492.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">Malabon</text><text x="1080" y="492.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">[Deactivated]</text><text x="1200" y="492.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">↺ Reactivate</text><rect x="280" y="510" width="1120" height="44" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="290" y="536.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">Jomel Ortega  (you)</text><text x="510" y="536.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">jomel@nena.test</text><text x="750" y="536.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">Admin</text><text x="870" y="536.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">Malabon, Cubao</text><text x="1080" y="536.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">[Active]</text><text x="1200" y="536.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">✎ Edit</text><rect x="280" y="602" width="1120" height="46" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1"/><text x="290" y="628.6666666666666" font-size="11" fill="#111">Rows per page  ▾ 10        ‹  Page 1 of 3  ›        sorted by Name</text><rect x="264" y="700" width="700" height="130" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1" stroke-dasharray="6 4"/><text x="274" y="720" font-size="12" fill="#111">Sorting is on NAME, EMAIL, ROLE and STATUS — not on STORES.</text><text x="274" y="737" font-size="12" fill="#111">The status pills default to All: a deactivated person is listed</text><text x="274" y="754" font-size="12" fill="#111">inline and badged, never hidden and never dimmed.</text><rect x="988" y="700" width="428" height="130" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1" stroke-dasharray="6 4"/><text x="998" y="720" font-size="12" fill="#111">A manager sees this list without the action</text><text x="998" y="737" font-size="12" fill="#111">column at all. The row for the person signed in</text><text x="998" y="754" font-size="12" fill="#111">has no Deactivate — you cannot lock yourself out.</text>
<text x="0" y="934" font-size="12" fill="#555">· THE LIST-SCREEN PATTERN every later back-office list follows: page header (title, one sentence, one primary action), then a single Card holding toolbar, table and pagination.</text><text x="0" y="954" font-size="12" fill="#555">· Role answers what kind of action; Store assignment answers where.</text><text x="0" y="974" font-size="12" fill="#555">· Nothing is deleted — deactivation preserves the audit trail.</text><text x="0" y="994" font-size="12" fill="#555">· Add employee opens the editor as a right-hand sheet, not a route. There is no /employees/new.</text><text x="0" y="1014" font-size="12" fill="#555">· Every mutation on this screen raises a toast: green on success, red on failure or refusal.</text>
</g>
</svg>
