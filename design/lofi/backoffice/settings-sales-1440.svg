<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="1116" viewBox="0 0 1520 1116" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
<rect width="1520" height="1116" fill="#fafafa"/>
<text x="40" y="34" font-size="17" font-weight="bold" fill="#111">Back-office · Sales settings</text>
<text x="40" y="56" font-size="12" fill="#555">backoffice · desktop 1440x900 · lo-fi: structure and order only — spacing, type, colour and states come from tokens</text>
<g transform="translate(40,78)">
<rect x="0" y="0" width="1440" height="900" fill="#ffffff" stroke="#111" stroke-width="2"/>
<rect x="0" y="0" width="240" height="900" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1"/><text x="16" y="34" font-size="15" text-anchor="start" font-weight="bold" fill="#111">DeanPOS</text><rect x="12" y="48" width="216" height="36" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="22" y="70.0" font-size="12" fill="#111">▾  Aling Nena&#x27;s</text><rect x="12" y="100" width="216" height="28" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1"/><text x="22" y="118.0" font-size="12" fill="#111">Reports</text><rect x="26" y="134" width="202" height="28" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1"/><text x="36" y="151.66666666666666" font-size="11" fill="#111">Summary</text><rect x="26" y="168" width="202" height="28" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1"/><text x="36" y="185.66666666666666" font-size="11" fill="#111">Orders</text><rect x="26" y="202" width="202" height="28" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1"/><text x="36" y="219.66666666666666" font-size="11" fill="#111">By item</text><rect x="26" y="236" width="202" height="28" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1"/><text x="36" y="253.66666666666666" font-size="11" fill="#111">By category</text><rect x="26" y="270" width="202" height="28" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1"/><text x="36" y="287.6666666666667" font-size="11" fill="#111">By cashier</text><rect x="26" y="304" width="202" height="28" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1"/><text x="36" y="321.6666666666667" font-size="11" fill="#111">By payment method</text><rect x="26" y="338" width="202" height="28" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1"/><text x="36" y="355.6666666666667" font-size="11" fill="#111">Discounts &amp; overrides</text><rect x="26" y="372" width="202" height="28" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1"/><text x="36" y="389.6666666666667" font-size="11" fill="#111">Refunds</text><rect x="12" y="406" width="216" height="28" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1"/><text x="22" y="424.0" font-size="12" fill="#111">Operations</text><rect x="26" y="440" width="202" height="28" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1"/><text x="36" y="457.6666666666667" font-size="11" fill="#111">Drawer sessions</text><rect x="26" y="474" width="202" height="28" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1"/><text x="36" y="491.6666666666667" font-size="11" fill="#111">Catalog</text><rect x="26" y="508" width="202" height="28" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1"/><text x="36" y="525.6666666666666" font-size="11" fill="#111">Add-ons</text><rect x="26" y="542" width="202" height="28" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1"/><text x="36" y="559.6666666666666" font-size="11" fill="#111">Discounts</text><rect x="26" y="576" width="202" height="28" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1"/><text x="36" y="593.6666666666666" font-size="11" fill="#111">Availability</text><rect x="12" y="610" width="216" height="28" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1"/><text x="22" y="628.0" font-size="12" fill="#111">Administration</text><rect x="26" y="644" width="202" height="28" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1"/><text x="36" y="661.6666666666666" font-size="11" fill="#111">Devices</text><rect x="26" y="678" width="202" height="28" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1"/><text x="36" y="695.6666666666666" font-size="11" fill="#111">Users</text><rect x="26" y="712" width="202" height="28" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1"/><text x="36" y="729.6666666666666" font-size="11" fill="#111">Roster</text><rect x="26" y="746" width="202" height="28" rx="0" fill="#cccccc" stroke="#333" stroke-width="1"/><text x="36" y="763.6666666666666" font-size="11" fill="#111">Settings</text><rect x="26" y="780" width="202" height="28" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1"/><text x="36" y="797.6666666666666" font-size="11" fill="#111">Quarantine</text><rect x="12" y="840" width="216" height="40" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="22" y="863.6666666666666" font-size="11" fill="#111">Jomel · admin  ·  Sign out</text><rect x="240" y="0" width="1200" height="64" rx="0" fill="#eeeeee" stroke="#333" stroke-width="1"/><text x="264" y="40" font-size="17" text-anchor="start" font-weight="bold" fill="#111">Settings — sales</text><text x="1416" y="40" font-size="12" text-anchor="end" font-weight="normal" fill="#111">Aling Nena&#x27;s</text><rect x="264" y="100" width="560" height="260" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="274" y="120" font-size="12" fill="#111">VAT</text><text x="274" y="137" font-size="12" fill="#111"></text><text x="274" y="154" font-size="12" fill="#111">□  This business is VAT-registered        ← OFF by default</text><text x="274" y="171" font-size="12" fill="#111">   Rate  [ 12 ] %</text><text x="274" y="188" font-size="12" fill="#111"></text><text x="274" y="205" font-size="12" fill="#111">A price is always what the customer pays.</text><text x="274" y="222" font-size="12" fill="#111">VAT is never ADDED — where enabled it is backed out</text><text x="274" y="239" font-size="12" fill="#111">of the recorded total for receipts and reports.</text><text x="274" y="256" font-size="12" fill="#111"></text><text x="274" y="273" font-size="12" fill="#111">Turning this on affects sales from now on. Last month</text><text x="274" y="290" font-size="12" fill="#111">stays as last month was sold.</text><rect x="848" y="100" width="560" height="260" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1" stroke-dasharray="6 4"/><text x="858" y="120" font-size="12" fill="#111">Most carinderias sit below the ₱3,000,000</text><text x="858" y="137" font-size="12" fill="#111">registration threshold and are not</text><text x="858" y="154" font-size="12" fill="#111">VAT-registered.</text><text x="858" y="171" font-size="12" fill="#111"></text><text x="858" y="188" font-size="12" fill="#111">Shipping VAT ON by default would hand those</text><text x="858" y="205" font-size="12" fill="#111">tenants figures that are confidently wrong and</text><text x="858" y="222" font-size="12" fill="#111">a receipt implying a registration they do not</text><text x="858" y="239" font-size="12" fill="#111">hold.</text><text x="858" y="256" font-size="12" fill="#111"></text><text x="858" y="273" font-size="12" fill="#111">So: off, until an owner says otherwise.</text><text x="264" y="410" font-size="14" text-anchor="start" font-weight="bold" fill="#111">Payment methods</text><rect x="1226" y="388" width="190" height="36" rx="0" fill="#cccccc" stroke="#333" stroke-width="1"/><text x="1321.0" y="410.0" font-size="12" text-anchor="middle" fill="#111">+ Add method</text><rect x="264" y="424" width="1152" height="32" rx="0" fill="#eeeeee" stroke="#333" stroke-width="1"/><text x="274" y="444.0" font-size="12" text-anchor="start" font-weight="bold" fill="#111">METHOD</text><text x="514" y="444.0" font-size="12" text-anchor="start" font-weight="bold" fill="#111">KIND</text><text x="674" y="444.0" font-size="12" text-anchor="start" font-weight="bold" fill="#111">MALABON</text><text x="814" y="444.0" font-size="12" text-anchor="start" font-weight="bold" fill="#111">CUBAO</text><text x="954" y="444.0" font-size="12" text-anchor="start" font-weight="bold" fill="#111">STATUS</text><text x="1134" y="444.0" font-size="12" text-anchor="start" font-weight="bold" fill="#111"></text><rect x="264" y="456" width="1152" height="32" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="274" y="476.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">Cash</text><text x="514" y="476.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">cash</text><text x="674" y="476.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">[ ON ]</text><text x="814" y="476.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">[ ON ]</text><text x="954" y="476.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">always on</text><text x="1134" y="476.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">— cannot be renamed or removed</text><rect x="264" y="488" width="1152" height="32" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="274" y="508.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">GCash</text><text x="514" y="508.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">recorded</text><text x="674" y="508.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">[ ON ]</text><text x="814" y="508.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">[ ON ]</text><text x="954" y="508.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">live</text><text x="1134" y="508.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">rename  deactivate</text><rect x="264" y="520" width="1152" height="32" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="274" y="540.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">Maya</text><text x="514" y="540.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">recorded</text><text x="674" y="540.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">[ ON ]</text><text x="814" y="540.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">[ OFF ]</text><text x="954" y="540.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">live</text><text x="1134" y="540.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">rename  deactivate</text><rect x="264" y="552" width="1152" height="32" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="274" y="572.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">Card</text><text x="514" y="572.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">recorded</text><text x="674" y="572.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">[ OFF ]</text><text x="814" y="572.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">[ ON ]</text><text x="954" y="572.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">live</text><text x="1134" y="572.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">rename  deactivate</text><rect x="264" y="584" width="1152" height="32" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="274" y="604.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">Bank transfer</text><text x="514" y="604.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">recorded</text><text x="674" y="604.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">[ OFF ]</text><text x="814" y="604.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">[ OFF ]</text><text x="954" y="604.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">deactivated</text><text x="1134" y="604.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">reactivate</text><rect x="264" y="632" width="700" height="140" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="274" y="652" font-size="12" fill="#111">A new tenant starts with CASH ONLY.</text><text x="274" y="669" font-size="12" fill="#111"></text><text x="274" y="686" font-size="12" fill="#111">Only cash reaches the drawer. Every other method RECORDS AN AMOUNT</text><text x="274" y="703" font-size="12" fill="#111">and authorises nothing — no gateway, no QR, no settlement.</text><text x="274" y="720" font-size="12" fill="#111">The name is captured on the sale, so renaming one never rewrites history.</text><rect x="988" y="632" width="420" height="140" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1" stroke-dasharray="6 4"/><text x="998" y="652" font-size="12" fill="#111">Code branches on KIND, never on a name.</text><text x="998" y="669" font-size="12" fill="#111"></text><text x="998" y="686" font-size="12" fill="#111">That is what keeps expected cash correct</text><text x="998" y="703" font-size="12" fill="#111">when a tenant adds a method nobody</text><text x="998" y="720" font-size="12" fill="#111">anticipated.</text>
<text x="0" y="934" font-size="12" fill="#555">· VAT, payment methods, and the Variance tolerance are Tenant settings; admin only, and audited.</text><text x="0" y="954" font-size="12" fill="#555">· A setting governs sales from now on. The value in force is captured on each sale.</text><text x="0" y="974" font-size="12" fill="#555">· Cash is seeded at tenant creation and is undeletable — enforced by a database constraint.</text><text x="0" y="994" font-size="12" fill="#555">· The Discount list is not here; it is back-office CRUD alongside the catalog.</text>
</g>
</svg>
