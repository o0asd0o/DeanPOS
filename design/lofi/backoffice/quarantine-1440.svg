idth="420" height="480" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1" stroke-dasharray="6 4"/><text x="998" y="120" font-size="12" fill="#111">Why a human decides</text><text x="998" y="137" font-size="12" fill="#111"></text><text x="998" y="154" font-size="12" fill="#111">A revoked device may still hold sales a real</text><text x="998" y="171" font-size="12" fill="#111">customer really paid for. Accepting blindly lets a</text><text x="998" y="188" font-size="12" fill="#111">stolen tablet inject revenue; rejecting blindly</text><text x="998" y="205" font-size="12" fill="#111">destroys takings.</text><text x="998" y="222" font-size="12" fill="#111"></text><text x="998" y="239" font-size="12" fill="#111">Every decision records who made it and why.</text>
