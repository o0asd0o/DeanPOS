ont-size="12" fill="#111">C9-0114</text><text x="274" y="317" font-size="12" fill="#111"></text><text x="274" y="334" font-size="12" fill="#111">Adobo · Whole ×2                       ₱240.00</text><text x="274" y="351" font-size="12" fill="#111">Cash · tendered ₱250 · change ₱10</text><text x="274" y="368" font-size="12" fill="#111"></text><text x="274" y="385" font-size="12" fill="#111">Device revoked 07-24 18:00</text><text x="274" y="402" font-size="12" fill="#111">Order taken 07-25 11:40 — after revocation</text><text x="274" y="419" font-size="12" fill="#111">Arrived 07-31 09:12</text><text x="274" y="436" font-size="12" fill="#111"></text><text x="274" y="453" font-size="12" fill="#111">Reason (required)  ▾</text><rect x="264" y="600" width="340" height="56" rx="0" fill="#cccccc" stroke="#333" stroke-width="1"/><text x="434.0" y="632.3333333333334" font-size="13" text-anchor="middle" fill="#111">Accept into ledger</text><rect x="624" y="600" width="340" height="56" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="794.0" y="632.3333333333334" font-size="13" text-anchor="middle" fill="#111">Reject</text><rect x="988" y="100" width="420" height="480" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1" stroke-dasharray="6 4"/><text x="998" y="120" font-size="12" fill="#111">Why a human decides</text><text x="998" y="137" font-size="12" fill="#111"></text><text x="998" y="154" font-size="12" fill="#111">A revoked device may still hold sales a real</text><text x="998" y="171" font-size="12" fill="#111">customer really paid for. Accepting blindly lets a</text><text x="998" y="188" font-size="12" fill="#111">stolen tablet inject revenue; rejecting blindly</text><text x="998" y="205" font-size="12" fill="#111">destroys takings.</text><text x="998" y="222" font-size="12" fill="#111"></text><text x="998" y="239" font-size="12" fill="#111">Every decision records who made it and why.</text>
