height="60" rx="0" fill="#eeeeee" stroke="#333" stroke-width="1"/><text x="274" y="606.3333333333334" font-size="13" fill="#111">Every row links to the original Order — and from there to the receipt the customer was given.</text>
<text x="0" y="934" font-size="12" fill="#555">· Filter-strip-plus-table shape, same as the other tabular reports.</text><text x="0" y="954" font-size="12" fill="#555">· A PARTIAL refund names the lines returned; a whole-order refund says so rather than listing every line.</text><text x="0" y="974" font-size="12" fill="#555">· Reason and approving manager are in the ROW. Money going back out is always attributable.</text><text x="0" y="994" font-size="12" fill="#555">· This report reads the same records the Summary waterfall subtracts — one source, two questions.</text><text x="0" y="1014" font-size="12" fill="#555">· TWO PEOPLE FILTERS, deliberately: who rang the original sale, and who approved the refund. Different questions.</text>
