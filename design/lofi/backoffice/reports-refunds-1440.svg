ke-width="1"/><text x="838" y="174" font-size="18" fill="#111">REFUNDS</text><text x="838" y="197" font-size="18" fill="#111">17</text><rect x="1110" y="148" width="306" height="78" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="1120" y="170" font-size="14" fill="#111">VOIDS  (counted, never mixed in)</text><text x="1120" y="189" font-size="14" fill="#111">9  ·  ₱1,180.00</text><rect x="264" y="248" width="1152" height="34" rx="0" fill="#eeeeee" stroke="#333" stroke-width="1"/><text x="274" y="269.0" font-size="12" text-anchor="start" font-weight="bold" fill="#111">TAKEN</text><text x="424" y="269.0" font-size="12" text-anchor="start" font-weight="bold" fill="#111">SOLD</text><text x="574" y="269.0" font-size="12" text-anchor="start" font-weight="bold" fill="#111">ORDER</text><text x="694" y="269.0" font-size="12" text-anchor="start" font-weight="bold" fill="#111">WHAT WAS RETURNED</text><text x="1024" y="269.0" font-size="12" text-anchor="start" font-weight="bold" fill="#111">AMOUNT</text><text x="1154" y="269.0" font-size="12" text-anchor="start" font-weight="bold" fill="#111">REASON</text><text x="1354" y="269.0" font-size="12" text-anchor="start" font-weight="bold" fill="#111">APPROVED BY</text><rect x="264" y="282" width="1152" height="34" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="274" y="303.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">31 Jul 13:02</text><text x="424" y="303.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">31 Jul 12:31</text><text x="574" y="303.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">C2-0419</text><text x="694" y="303.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">whole order</text><text x="1024" y="303.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">₱175.00</text><text x="1154" y="303.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">wrong order</text><text x="1354" y="303.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">Boy</text><rect x="264" y="316" width="1152" height="34" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="274" y="337.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">31 Jul 11:20</text><text x="424" y="337.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">30 Jul 19:44</text><text x="574" y="337.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">C1-0377</text><text x="694" y="337.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">1 of 4 lines · Adobo ×1</text><text x="1024" y="337.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">₱120.00</text><text x="1154" y="337.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">spoiled</text><text x="1354" y="337.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">Boy</text><rect x="264" y="350" width="1152" height="34" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="274" y="371.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">30 Jul 18:05</text><text x="424" y="371.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">30 Jul 18:01</text><text x="574" y="371.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">C2-0402</text><text x="694" y="371.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">whole order</text><text x="1024" y="371.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">₱310.00</text><text x="1154" y="371.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">customer left</text><text x="1354" y="371.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">Nena</text><rect x="264" y="384" width="1152" height="34" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="274" y="405.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">29 Jul 12:44</text><text x="424" y="405.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">29 Jul 12:40</text><text x="574" y="405.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">C2-0388</text><text x="694" y="405.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">2 of 5 lines</text><text x="1024" y="405.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">₱95.00</text><text x="1154" y="405.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">wrong item</text><text x="1354" y="405.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">Boy</text><rect x="264" y="424" width="700" height="120" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1" stroke-dasharray="6 4"/><text x="274" y="444" font-size="12" fill="#111">TWO DATES ON EVERY ROW, and they are different questions.</text><text x="274" y="461" font-size="12" fill="#111"></text><text x="274" y="478" font-size="12" fill="#111">The Summary waterfall attributes a refund to the day of the SALE.</text><text x="274" y="495" font-size="12" fill="#111">This report lists it on the day it was TAKEN — what left the drawer today.</text><rect x="988" y="424" width="428" height="120" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1" stroke-dasharray="6 4"/><text x="998" y="444" font-size="12" fill="#111">Voids are counted beside refunds and never</text><text x="998" y="461" font-size="12" fill="#111">summed into them.</text><text x="998" y="478" font-size="12" fill="#111"></text><text x="998" y="495" font-size="12" fill="#111">A cancelled sale and a returned one are</text><text x="998" y="512" font-size="12" fill="#111">different events.</text><rect x="264" y="572" width="1152" height="60" rx="0" fill="#eeeeee" stroke="#333" stroke-width="1"/><text x="274" y="606.3333333333334" font-size="13" fill="#111">Every row links to the original Order — and from there to the receipt the customer was given.</text>
<text x="0" y="934" font-size="12" fill="#555">· Filter-strip-plus-table shape, same as the other tabular reports.</text><text x="0" y="954" font-size="12" fill="#555">· A PARTIAL refund names the lines returned; a whole-order refund says so rather than listing every line.</text><text x="0" y="974" font-size="12" fill="#555">· Reason and approving manager are in the ROW. Money going back out is always attributable.</text><text x="0" y="994" font-size="12" fill="#555">· This report reads the same records the Summary waterfall subtracts — one source, two questions.</text><text x="0" y="1014" font-size="12" fill="#555">· TWO PEOPLE FILTERS, deliberately: who rang the original sale, and who approved the refund. Different questions.</text>
