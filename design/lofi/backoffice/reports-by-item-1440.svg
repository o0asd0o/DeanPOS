 fill="#111">  For a carinderia this is a PREP decision — how much to cook whole versus half — not analytics.</text><rect x="264" y="496" width="700" height="96" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1" stroke-dasharray="6 4"/><text x="274" y="516" font-size="12" fill="#111">No standalone modifier report and no standalone add-on report.</text><text x="274" y="533" font-size="12" fill="#111">Both are breakdowns inside this one. Neither earns a nav entry.</text><rect x="988" y="496" width="420" height="96" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1" stroke-dasharray="6 4"/><text x="998" y="516" font-size="12" fill="#111">Gross profit and margin do not appear.</text><text x="998" y="533" font-size="12" fill="#111">DeanPOS knows prices, not costs.</text>
