rt" font-weight="normal" fill="#111">active  ⚠ old release</text><text x="1474" y="267.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">rename  revoke</text><rect x="264" y="280" width="1152" height="34" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="274" y="301.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">Old tablet</text><text x="494" y="301.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">Malabon</text><text x="674" y="301.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">6 days ago</text><text x="854" y="301.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">2 held</text><text x="1074" y="301.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">r-102</text><text x="1214" y="301.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">REVOKED</text><text x="1474" y="301.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">review held</text><rect x="264" y="330" width="620" height="200" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="274" y="351" font-size="13" fill="#111">Enrol a device</text><text x="274" y="369" font-size="13" fill="#111"></text><text x="274" y="387" font-size="13" fill="#111">Code:  F4K9 — 2X7M</text><text x="274" y="405" font-size="13" fill="#111">Store: Malabon</text><text x="274" y="423" font-size="13" fill="#111">Expires in 09:41</text><text x="274" y="441" font-size="13" fill="#111"></text><text x="274" y="459" font-size="13" fill="#111">Single-use. Enter it on the terminal.</text><rect x="908" y="330" width="500" height="200" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1" stroke-dasharray="6 4"/><text x="918" y="350" font-size="12" fill="#111">Revoking is immediate and enforced on replay.</text><text x="918" y="367" font-size="12" fill="#111"></text><text x="918" y="384" font-size="12" fill="#111">Sales already queued on a revoked device are HELD</text><text x="918" y="401" font-size="12" fill="#111">for review — never dropped, never auto-accepted.</text><text x="918" y="418" font-size="12" fill="#111">That money was really collected.</text>
<text x="0" y="934" font-size="12" fill="#555">· Queue depth and last-seen come from device telemetry; this is where a stalled terminal shows up.</text><text x="0" y="954" font-size="12" fill="#555">· Enrolment codes are single-use, short-lived, and bound to one Store.</text><text x="0" y="974" font-size="12" fill="#555">· Revoke needs a confirmation and is the response to a stolen tablet.</text>
