<rect x="0" y="0" width="240" height="900" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1"/><text x="16" y="34" font-size="15" text-anchor="start" font-weight="bold" fill="#111">DeanPOS</text><rect x="12" y="48" width="216" height="36" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="22" y="70.0" font-size="12" fill="#111">▾  Aling Nena&#x27;s</text><rect x="12" y="100" width="216" height="28" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1"/><text x="22" y="118.0" font-size="12" fill="#111">Reports</text><rect x="26" y="134" width="202" height="28" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1"/><text x="36" y="151.66666666666666" font-size="11" fill="#111">Summary</text><rect x="26" y="168" width="202" height="28" rx="0" fill="#cccccc" stroke="#333" stroke-width="1"/><text x="36" y="185.66666666666666" font-size="11" fill="#111">Orders</text><rect x="26" y="202" width="202" height="28" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1"/><text x="36" y="219.66666666666666" font-size="11" fill="#111">By item</text><rect x="26" y="236" width="202" height="28" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1"/><text x="36" y="253.66666666666666" font-size="11" fill="#111">By category</text><rect x="26" y="270" width="202" height="28" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1"/><text x="36" y="287.6666666666667" font-size="11" fill="#111">By cashier</text><rect x="26" y="304" width="202" height="28" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1"/><text x="36" y="321.6666666666667" font-size="11" fill="#111">By payment method</text><rect x="26" y="338" width="202" height="28" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1"/><text x="36" y="355.6666666666667" font-size="11" fill="#111">Discounts &amp; overrides</text><rect x="26" y="372" width="202" height="28" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1"/><text x="36" y="389.6666666666667" font-size="11" fill="#111">Refunds</text><rect x="12" y="406" width="216" height="28" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1"/><text x="22" y="424.0" font-size="12" fill="#111">Operations</text><rect x="26" y="440" width="202" height="28" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1"/><text x="36" y="457.6666666666667" font-size="11" fill="#111">Drawer sessions</text><rect x="26" y="474" width="202" height="28" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1"/><text x="36" y="491.6666666666667" font-size="11" fill="#111">Catalog</text><rect x="26" y="508" width="202" height="28" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1"/><text x="36" y="525.6666666666666" font-size="11" fill="#111">Add-ons</text><rect x="26" y="542" width="202" height="28" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1"/><text x="36" y="559.6666666666666" font-size="11" fill="#111">Discounts</text><rect x="26" y="576" width="202" height="28" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1"/><text x="36" y="593.6666666666666" font-size="11" fill="#111">Availability</text><rect x="12" y="610" width="216" height="28" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1"/><text x="22" y="628.0" font-size="12" fill="#111">Administration</text><rect x="26" y="644" width="202" height="28" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1"/><text x="36" y="661.6666666666666" font-size="11" fill="#111">Devices</text><rect x="26" y="678" width="202" height="28" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1"/><text x="36" y="695.6666666666666" font-size="11" fill="#111">Users</text><rect x="26" y="712" width="202" height="28" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1"/><text x="36" y="729.6666666666666" font-size="11" fill="#111">Roster</text><rect x="26" y="746" width="202" height="28" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1"/><text x="36" y="763.6666666666666" font-size="11" fill="#111">Settings</text><rect x="26" y="780" width="202" height="28" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1"/><text x="36" y="797.6666666666666" font-size="11" fill="#111">Quarantine</text><rect x="12" y="840" width="216" height="40" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="22" y="863.6666666666666" font-size="11" fill="#111">Jomel · admin  ·  Sign out</text><rect x="240" y="0" width="1200" height="64" rx="0" fill="#eeeeee" stroke="#333" stroke-width="1"/><text x="264" y="40" font-size="17" text-anchor="start" font-weight="bold" fill="#111">Receipt · C1-0388</text><text x="1416" y="40" font-size="12" text-anchor="end" font-weight="normal" fill="#111">31 Jul 2026 12:35 · Malabon · Counter 1</text><rect x="264" y="88" width="200" height="40" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="364.0" y="112.0" font-size="12" text-anchor="middle" fill="#111">← Back to Orders</text><rect x="1076" y="88" width="160" height="40" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="1156.0" y="112.0" font-size="12" text-anchor="middle" fill="#111">Print</text><rect x="1246" y="88" width="170" height="40" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="1331.0" y="112.0" font-size="12" text-anchor="middle" fill="#111">Export PDF</text><rect x="264" y="148" width="520" height="600" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="274" y="168" font-size="12" fill="#111">DEANPOS · MALABON</text><text x="274" y="185" font-size="12" fill="#111">31 Jul 2026  12:35</text><text x="274" y="202" font-size="12" fill="#111">Order C1-0388 · Counter 1 · Dina</text><text x="274" y="219" font-size="12" fill="#111">Table 4 · dine in</text><text x="274" y="236" font-size="12" fill="#111"></text><text x="274" y="253" font-size="12" fill="#111">Adobo · Whole            ×2      ₱240.00</text><text x="274" y="270" font-size="12" fill="#111">  + Extra rice           ×1       ₱15.00</text><text x="274" y="287" font-size="12" fill="#111">Munggo · Half            ×1       ₱55.00</text><text x="274" y="304" font-size="12" fill="#111">Rice                     ×2       ₱30.00</text><text x="274" y="321" font-size="12" fill="#111">Softdrink                ×1       ₱45.00</text><text x="274" y="338" font-size="12" fill="#111">                            ────────────</text><text x="274" y="355" font-size="12" fill="#111">Subtotal                         ₱385.00</text><text x="274" y="372" font-size="12" fill="#111">Senior citizen / PWD 20%         −₱77.00</text><text x="274" y="389" font-size="12" fill="#111">  ref SC-0099213 (Senior ID)</text><text x="274" y="406" font-size="12" fill="#111">VAT — exempt on this sale               —</text><text x="274" y="423" font-size="12" fill="#111">                            ────────────</text><text x="274" y="440" font-size="12" fill="#111">TOTAL                            ₱308.00</text><text x="274" y="457" font-size="12" fill="#111">Cash tendered                    ₱500.00</text><text x="274" y="474" font-size="12" fill="#111">Change                           ₱192.00</text><text x="274" y="491" font-size="12" fill="#111"></text><rect x="812" y="148" width="604" height="168" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1" stroke-dasharray="6 4"/><text x="822" y="168" font-size="12" fill="#111">NOTHING IS STORED.</text><text x="822" y="185" font-size="12" fill="#111"></text><text x="822" y="202" font-size="12" fill="#111">This is rendered from the Order on demand (ADR-0012).</text><text x="822" y="219" font-size="12" fill="#111">No PDF in a bucket, no receipt number sequence — the</text><text x="822" y="236" font-size="12" fill="#111">Order&#x27;s identity IS the receipt&#x27;s.</text><rect x="812" y="336" width="604" height="190" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1" stroke-dasharray="6 4"/><text x="822" y="356" font-size="12" fill="#111">It renders the same in 2030 because every input was</text><text x="822" y="373" font-size="12" fill="#111">captured at sale time:</text><text x="822" y="390" font-size="12" fill="#111"></text><text x="822" y="407" font-size="12" fill="#111">  the recorded prices · the names as they were</text><text x="822" y="424" font-size="12" fill="#111">  the VAT rate in force, or no VAT at all</text><text x="822" y="441" font-size="12" fill="#111">  the discount name and its reference</text><text x="822" y="458" font-size="12" fill="#111">  the payment method as it was called then</text><rect x="812" y="546" width="604" height="90" rx="0" fill="#eeeeee" stroke="#333" stroke-width="1"/><text x="822" y="566" font-size="12" fill="#111">A reprint is marked as a reprint, writes no record,</text><text x="822" y="583" font-size="12" fill="#111">and moves no total. It is not a financial event.</text><rect x="812" y="656" width="604" height="92" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="822" y="676" font-size="12" fill="#111">A voided or refunded Order&#x27;s receipt says so.</text><text x="822" y="693" font-size="12" fill="#111">A reprint cannot be passed off as a live sale.</text>
<text x="0" y="934" font-size="12" fill="#555">· THE DRILL LEAF OF ORDERS, not a nav entry. A Receipts page would be the Orders list under a second name.</text><text x="0" y="954" font-size="12" fill="#555">· The same template renders on the terminal. If the two ever diverge, one sale prints two ways.</text><text x="0" y="974" font-size="12" fill="#555">· The SC/PWD reference is on the receipt and is personal data: shown, exported, never logged.</text><text x="0" y="994" font-size="12" fill="#555">· Ticket label and fulfilment tag appear here because they were captured on the Order.</text><text x="0" y="1014" font-size="12" fill="#555">· Reached from an Order row, from a refund row, and from an order-number search.</text><text x="0" y="1034" font-size="12" fill="#555">· Back returns to the list WITH ITS FILTERS INTACT — including the rung-up-by filter this was opened from.</text>
</g>
</svg>
