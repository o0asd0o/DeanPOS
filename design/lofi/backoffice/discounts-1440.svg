33" stroke-width="1"/><text x="274" y="305.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">Fiesta 2025</text><text x="554" y="305.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">percent</text><text x="694" y="305.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">10%</text><text x="834" y="305.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">order</text><text x="954" y="305.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">no</text><text x="1094" y="305.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">—</text><text x="1334" y="305.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">no</text><text x="1454" y="305.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">archived</text><rect x="264" y="336" width="700" height="300" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="274" y="356" font-size="12" fill="#111">New discount</text><text x="274" y="373" font-size="12" fill="#111"></text><text x="274" y="390" font-size="12" fill="#111">Name          [ Senior citizen / PWD          ]</text><text x="274" y="407" font-size="12" fill="#111">Type          (•) percent   ( ) amount</text><text x="274" y="424" font-size="12" fill="#111">Value         [ 20 ] %      □ leave blank — prompt the cashier</text><text x="274" y="441" font-size="12" fill="#111">Scope         (•) one line  ( ) whole order</text><text x="274" y="458" font-size="12" fill="#111">              amount discounts are whole-order only</text><text x="274" y="475" font-size="12" fill="#111"></text><text x="274" y="492" font-size="12" fill="#111">□ Requires a manager</text><text x="274" y="509" font-size="12" fill="#111">☑ VAT-exempt — removes VAT from this sale</text><text x="274" y="526" font-size="12" fill="#111">☑ Requires a reference   label [ Senior ID     ]</text><text x="274" y="543" font-size="12" fill="#111"></text><text x="274" y="560" font-size="12" fill="#111">                                   [ Archive ]  [ Save ]</text><rect x="988" y="336" width="420" height="148" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1" stroke-dasharray="6 4"/><text x="998" y="356" font-size="12" fill="#111">This is not a promotions engine: no</text><text x="998" y="373" font-size="12" fill="#111">conditions, no schedules, no codes, no</text><text x="998" y="390" font-size="12" fill="#111">BOGO, no segments, no stacking rules.</text><text x="998" y="407" font-size="12" fill="#111">A person applies one, on purpose,</text><text x="998" y="424" font-size="12" fill="#111">every time.</text><text x="998" y="441" font-size="12" fill="#111"></text><text x="998" y="458" font-size="12" fill="#111">Archived, never deleted — an Order from</text><text x="998" y="475" font-size="12" fill="#111">March still references it.</text><text x="988" y="516" font-size="12" text-anchor="start" font-weight="bold" fill="#111">EMPTY STATE — what every new tenant sees</text><rect x="988" y="526" width="420" height="110" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="998" y="546" font-size="12" fill="#111">No discounts configured.</text><text x="998" y="563" font-size="12" fill="#111"></text><text x="998" y="580" font-size="12" fill="#111">Add one if your shop gives a senior</text><text x="998" y="597" font-size="12" fill="#111">citizen or staff discount.</text><text x="998" y="614" font-size="12" fill="#111"></text><text x="998" y="631" font-size="12" fill="#111">            [ + New discount ]</text><rect x="988" y="648" width="420" height="88" rx="0" fill="#eeeeee" stroke="#333" stroke-width="1"/><text x="998" y="667" font-size="11" fill="#111">Not an edge case — this is the DEFAULT, and the</text><text x="998" y="683" font-size="11" fill="#111">configuration most tenants will keep. The terminal</text><text x="998" y="699" font-size="11" fill="#111">shows no discount control at all in this state.</text>
<text x="0" y="934" font-size="12" fill="#555">· Optional. Empty list is the default and a complete configuration.</text><text x="0" y="954" font-size="12" fill="#555">· VAT-exempt is what makes the statutory Senior/PWD case correct rather than approximate.</text><text x="0" y="974" font-size="12" fill="#555">· The reference label is tenant-set because staff call it different things.</text><text x="0" y="994" font-size="12" fill="#555">· A manual price override is NOT a Discount and stays a separate, manager-gated thing.</text>
