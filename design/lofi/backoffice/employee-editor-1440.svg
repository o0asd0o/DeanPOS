r="start" font-weight="bold" fill="#111">Hi Jomel</text><rect x="576.0" y="18" width="288" height="44" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="586.0" y="44.0" font-size="12" fill="#111">Search…                          ⌘K</text><rect x="1320" y="18" width="44" height="44" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="1342.0" y="43.666666666666664" font-size="11" text-anchor="middle" fill="#111">bell</text><rect x="1372" y="18" width="44" height="44" rx="0" fill="#eeeeee" stroke="#333" stroke-width="1"/><text x="1394.0" y="44.0" font-size="12" text-anchor="middle" fill="#111">JO</text><line x1="264" y1="80" x2="1416" y2="80" stroke="#333"/><text x="1416" y="74" font-size="12" text-anchor="end" font-weight="normal" fill="#111"></text><rect x="240" y="0" width="1200" height="900" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1" stroke-dasharray="6 4"/><rect x="912" y="16" width="512" height="868" rx="16" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="928" y="44" font-size="15" text-anchor="start" font-weight="bold" fill="#111">New employee</text><text x="1408" y="44" font-size="15" text-anchor="end" font-weight="normal" fill="#111">✕</text><line x1="912" y1="62" x2="1424" y2="62" stroke="#333"/><text x="928" y="96" font-size="11" text-anchor="start" font-weight="normal" fill="#111">First name</text><rect x="928" y="106" width="232" height="44" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="938" y="132.0" font-size="12" fill="#111">Juana</text><text x="1176" y="96" font-size="11" text-anchor="start" font-weight="normal" fill="#111">Last name</text><rect x="1176" y="106" width="232" height="44" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="1186" y="132.0" font-size="12" fill="#111">dela Cruz</text><text x="928" y="186" font-size="11" text-anchor="start" font-weight="normal" fill="#111">Email</text><rect x="928" y="196" width="480" height="44" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="938" y="222.0" font-size="12" fill="#111">juana@nena.test</text><text x="928" y="276" font-size="11" text-anchor="start" font-weight="normal" fill="#111">Temporary password            [ Generate ]</text><rect x="928" y="286" width="480" height="44" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="938" y="312.0" font-size="12" fill="#111">K7QM2P                                        ◉ show</text><rect x="928" y="336" width="480" height="34" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1" stroke-dasharray="6 4"/><text x="938" y="356.6666666666667" font-size="11" fill="#111">They are asked to choose their own at first sign-in.</text><text x="928" y="406" font-size="11" text-anchor="start" font-weight="normal" fill="#111">Role</text><rect x="928" y="416" width="480" height="44" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="938" y="442.0" font-size="12" fill="#111">▾  Cashier</text><text x="928" y="496" font-size="11" text-anchor="start" font-weight="normal" fill="#111">Stores</text><rect x="928" y="506" width="480" height="96" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="938" y="526" font-size="12" fill="#111">[✓] Malabon</text><text x="938" y="543" font-size="12" fill="#111">[ ] Cubao</text><line x1="912" y1="808" x2="1424" y2="808" stroke="#333"/><rect x="928" y="822" width="150" height="46" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="1003.0" y="849.0" font-size="12" text-anchor="middle" fill="#111">✕  Cancel</text><rect x="1218" y="822" width="190" height="46" rx="0" fill="#cccccc" stroke="#333" stroke-width="1"/><text x="1313.0" y="849.0" font-size="12" text-anchor="middle" fill="#111">✓  Create employee</text><rect x="264" y="300" width="380" height="150" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1" stroke-dasharray="6 4"/><text x="274" y="320" font-size="12" fill="#111">The page behind stays visible and</text><text x="274" y="337" font-size="12" fill="#111">clickable — the sheet is not modal, so</text><text x="274" y="354" font-size="12" fill="#111">one row&#x27;s editor can be swapped straight</text><text x="274" y="371" font-size="12" fill="#111">for another&#x27;s.</text>
<text x="0" y="934" font-size="12" fill="#555">· THE EDITOR PATTERN for every later back-office record: a detached right-hand sheet with a fixed header, one scrolling body, and a fixed action row — Cancel left, the commit right.</text><text x="0" y="954" font-size="12" fill="#555">· One form, one submit. Deactivate, reactivate and password reset are their own actions, never a field in here.</text><text x="0" y="974" font-size="12" fill="#555">· Editing an existing employee replaces Temporary password with a Reset password action in the footer, and the email becomes read-only.</text><text x="0" y="994" font-size="12" fill="#555">· The same sheet, same footer, is the Store editor — only the fields differ.</text>
</g>
</svg>
