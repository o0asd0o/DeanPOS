<rect x="0" y="0" width="240" height="900" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1"/><text x="16" y="34" font-size="15" text-anchor="start" font-weight="bold" fill="#111">DeanPOS</text><rect x="12" y="64" width="216" height="28" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1"/><text x="22" y="82.0" font-size="12" fill="#111">Reports</text><rect x="26" y="98" width="202" height="28" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1"/><text x="36" y="115.66666666666667" font-size="11" fill="#111">▫  Summary</text><rect x="26" y="132" width="202" height="28" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1"/><text x="36" y="149.66666666666666" font-size="11" fill="#111">▫  Orders</text><rect x="26" y="166" width="202" height="28" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1"/><text x="36" y="183.66666666666666" font-size="11" fill="#111">▫  By item</text><rect x="26" y="200" width="202" height="28" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1"/><text x="36" y="217.66666666666666" font-size="11" fill="#111">▫  By category</text><rect x="26" y="234" width="202" height="28" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1"/><text x="36" y="251.66666666666666" font-size="11" fill="#111">▫  By cashier</text><rect x="26" y="268" width="202" height="28" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1"/><text x="36" y="285.6666666666667" font-size="11" fill="#111">▫  By payment method</text><rect x="26" y="302" width="202" height="28" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1"/><text x="36" y="319.6666666666667" font-size="11" fill="#111">▫  Discounts &amp; overrides</text><rect x="26" y="336" width="202" height="28" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1"/><text x="36" y="353.6666666666667" font-size="11" fill="#111">▫  Refunds</text><rect x="12" y="370" width="216" height="28" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1"/><text x="22" y="388.0" font-size="12" fill="#111">Operations</text><rect x="26" y