e cheapest denial-of-service here.</text><rect x="1020" y="180" width="396" height="400" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="1030" y="199" font-size="11" fill="#111">C1-0388   ·   12:35   ·   Dina</text><text x="1030" y="215" font-size="11" fill="#111">Malabon · Counter 1 · session 07-31 07:02</text><text x="1030" y="231" font-size="11" fill="#111"></text><text x="1030" y="247" font-size="11" fill="#111">Adobo · Whole  ×2            ₱240.00</text><text x="1030" y="263" font-size="11" fill="#111">  + Extra rice ×1             ₱15.00</text><text x="1030" y="279" font-size="11" fill="#111">Munggo · Half  ×1             ₱55.00</text><text x="1030" y="295" font-size="11" fill="#111">Rice           ×2             ₱30.00</text><text x="1030" y="311" font-size="11" fill="#111">Softdrink      ×1             ₱45.00</text><text x="1030" y="327" font-size="11" fill="#111">                        ───────────</text><text x="1030" y="343" font-size="11" fill="#111">Subtotal                    ₱385.00</text><text x="1030" y="359" font-size="11" fill="#111">Senior/PWD 20%              −₱77.00</text><text x="1030" y="375" font-size="11" fill="#111">  ref: SC-0099213 (Senior ID)</text><text x="1030" y="391" font-size="11" fill="#111">VAT — exempt on this sale         —</text><text x="1030" y="407" font-size="11" fill="#111">                        ───────────</text><text x="1030" y="423" font-size="11" fill="#111">TOTAL                       ₱308.00</text><text x="1030" y="439" font-size="11" fill="#111">Cash · tendered ₱500 · change ₱192</text><text x="1030" y="455" font-size="11" fill="#111"></text><text x="1030" y="471" font-size="11" fill="#111">Recorded prices. Never re-priced.</text><rect x="1020" y="596" width="396" height="176" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1" stroke-dasharray="6 4"/><text x="1030" y="616" font-size="12" fill="#111">No cancel. No edit. No delete.</text><text x="1030" y="633" font-size="12" fill="#111"></text><text x="1030" y="650" font-size="12" fill="#111">A paid Order is reversed by a Void or a</text><text x="1030" y="667" font-size="12" fill="#111">Refund taken at the terminal, each with a</text><text x="1030" y="684" font-size="12" fill="#111">reason and an approving manager.</text><text x="1030" y="701" font-size="12" fill="#111"></text><text x="1030" y="718" font-size="12" fill="#111">A comparable product lets the back-office</text><text x="1030" y="735" font-size="12" fill="#111">make a row disappear. This one does not.</text>
<text x="0" y="934" font-size="12" fill="#555">· The drill target for every other report. Arriving from a figure lands here with filters applied.</text><text x="0" y="954" font-size="12" fill="#555">· Reversal state and its approver are in the ROW — not something you find by opening it.</text><text x="0" y="974" font-size="12" fill="#555">· Two export shapes: one row per Order (register) and one row per OrderLine (what a bookkeeper wants).</text><text x="0" y="994" font-size="12" fill="#555">· A discount reference is a real person&#x27;s ID number. Shown here, never logged.</text><text x="0" y="1014" font-size="12" fill="#555">· The method column disappears entirely for a cash-only tenant.</text>
