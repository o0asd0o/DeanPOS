x="280" y="290" width="1120" height="44" rx="0" fill="#eeeeee" stroke="#333" stroke-width="1"/><text x="290" y="316.0" font-size="12" text-anchor="start" font-weight="bold" fill="#111">NAME ▲</text><text x="590" y="316.0" font-size="12" text-anchor="start" font-weight="bold" fill="#111">BUSINESS-DAY START</text><text x="870" y="316.0" font-size="12" text-anchor="start" font-weight="bold" fill="#111">TABLE LABELS</text><text x="1070" y="316.0" font-size="12" text-anchor="start" font-weight="bold" fill="#111">STATUS</text><text x="1220" y="316.0" font-size="12" text-anchor="start" font-weight="bold" fill="#111"></text><rect x="280" y="334" width="1120" height="44" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="290" y="360.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">Cubao</text><text x="590" y="360.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">06:00</text><text x="870" y="360.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">8</text><text x="1070" y="360.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">[Active]</text><text x="1220" y="360.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">✎ Edit    ⏻ Deactivate</text><rect x="280" y="378" width="1120" height="44" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="290" y="404.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">Malabon</text><text x="590" y="404.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">05:00</text><text x="870" y="404.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">12</text><text x="1070" y="404.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">[Active]</text><text x="1220" y="404.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">✎ Edit    ⏻ Deactivate</text><rect x="280" y="422" width="1120" height="44" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="290" y="448.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">Closing Soon</text><text x="590" y="448.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">06:00</text><text x="870" y="448.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">None</text><text x="1070" y="448.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">[Deactivated]</text><text x="1220" y="448.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">↺ Reactivate</text><rect x="280" y="522" width="1120" height="46" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1"/><text x="290" y="548.6666666666666" font-size="11" fill="#111">Rows per page  ▾ 10        ‹  Page 1 of 3  ›        sorted by Name</text><rect x="264" y="620" width="700" height="130" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="274" y="640" font-size="12" fill="#111">EMPTY STATE — what a new tenant sees</text><text x="274" y="657" font-size="12" fill="#111"></text><text x="274" y="674" font-size="12" fill="#111">No stores yet. A store is one outlet — its own sales, its own</text><text x="274" y="691" font-size="12" fill="#111">devices, and its own table labels. Use Add store above.</text><rect x="988" y="620" width="428" height="130" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1" stroke-dasharray="6 4"/><text x="998" y="640" font-size="12" fill="#111">Same Card, same toolbar, same pagination as</text><text x="998" y="657" font-size="12" fill="#111">Employees. Only the columns differ — that is</text><text x="998" y="674" font-size="12" fill="#111">the point of the pattern.</text>
<text x="0" y="934" font-size="12" fill="#555">· The Employees list&#x27;s shape, with this record&#x27;s columns. Table labels shows the COUNT, or None — the labels themselves are edited in the sheet.</text><text x="0" y="954" font-size="12" fill="#555">· A deactivated Store stays inline, at full contrast, badged, with Reactivate as its only row action.</text><text x="0" y="974" font-size="12" fill="#555">· Business-day start is per Store: it decides which day a late-night sale belongs to.</text>
