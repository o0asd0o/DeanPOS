 y="343.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">Extra rice, Itlog</text><text x="1414" y="343.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">edit  archive</text><rect x="264" y="372" width="200" height="40" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="364.0" y="396.0" font-size="12" text-anchor="middle" fill="#111">+ Add variant</text><text x="264" y="452" font-size="13" text-anchor="start" font-weight="bold" fill="#111">Modifier groups — shared, edit once and every linked variant follows</text><rect x="264" y="466" width="560" height="190" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="274" y="486" font-size="12" fill="#111">Group: Size</text><text x="274" y="503" font-size="12" fill="#111">Rule: ▾ choose exactly one (required)</text><text x="274" y="520" font-size="12" fill="#111"></text><text x="274" y="537" font-size="12" fill="#111">• Whole   ×1.0   [default]</text><text x="274" y="554" font-size="12" fill="#111">• Half    ×0.5</text><text x="274" y="571" font-size="12" fill="#111"></text><text x="274" y="588" font-size="12" fill="#111">Linked to 3 variants</text><rect x="848" y="466" width="560" height="190" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1" stroke-dasharray="6 4"/><text x="858" y="486" font-size="12" fill="#111">Delta type is stored, never inferred:</text><text x="858" y="503" font-size="12" fill="#111"></text><text x="858" y="520" font-size="12" fill="#111">  absolute    ± centavos</text><text x="858" y="537" font-size="12" fill="#111">  multiplier  × rate</text><text x="858" y="554" font-size="12" fill="#111"></text><text x="858" y="571" font-size="12" fill="#111">0.5 is never guessed as ₱0.50 or half price.</text><rect x="264" y="680" width="220" height="40" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="374.0" y="704.0" font-size="12" text-anchor="middle" fill="#111">+ Add modifier group</text><rect x="1216" y="824" width="200" height="52" rx="0" fill="#cccccc" stroke="#333" stroke-width="1"/><text x="1316.0" y="854.3333333333334" font-size="13" text-anchor="middle" fill="#111">Save</text>
<text x="0" y="934" font-size="12" fill="#555">· Price lives on the Variant. The MenuItem has none and is not sellable alone.</text><text x="0" y="954" font-size="12" fill="#555">· Modifier groups are shared objects — editing one updates every linked Variant.</text><text x="0" y="974" font-size="12" fill="#555">· A price change affects future Orders only; past OrderLines keep their recorded price.</text>
