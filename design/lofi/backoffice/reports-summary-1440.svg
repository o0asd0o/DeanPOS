<text x="0" y="934" font-size="12" fill="#555">· This screen is also the back-office landing page. There is no separate dashboard.</text><text x="0" y="954" font-size="12" fill="#555">· The strip is a waterfall: gross − discounts − overrides − refunds = net. Selecting a tile charts that figure.</text><text x="0" y="974" font-size="12" fill="#555">· The VAT tile is drawn dashed because it is CONDITIONAL — a non-VAT tenant sees no VAT anywhere.</text><text x="0" y="994" font-size="12" fill="#555">· Discounts and overrides are separate tiles on purpose: a statutory discount is not somebody changing a price.</text><text x="0" y="1014" font-size="12" fill="#555">· A sale belongs to the day the DEVICE says it happened, not the day it arrived.</text><text x="0" y="1034" font-size="12" fill="#555">· Bucketing is automatic from the range length. There is no bucket selector.</text><text x="0" y="1054" font-size="12" fill="#555">· Charts are additions to tables, never replacements.</text>
