<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1036" viewBox="0 0 1360 1036" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
<rect width="1360" height="1036" fill="#fafafa"/>
<text x="40" y="34" font-size="17" font-weight="bold" fill="#111">POS · Open tickets</text>
<text x="40" y="56" font-size="12" fill="#555">pos · tablet landscape 1280x800 · lo-fi: structure and order only — spacing, type, colour and states come from tokens</text>
<g transform="translate(40,78)">
<rect x="0" y="0" width="1280" height="800" fill="#ffffff" stroke="#111" stroke-width="2"/>
<rect x="0" y="0" width="1280" height="56" rx="0" fill="#eeeeee" stroke="#333" stroke-width="1"/><text x="14" y="33.0" font-size="13" text-anchor="start" font-weight="normal" fill="#111">DeanPOS · Malabon · Counter 2</text><rect x="530.0" y="12" width="220" height="32" rx="0" fill="#cccccc" stroke="#333" stroke-width="1"/><text x="640.0" y="32.0" font-size="12" text-anchor="middle" fill="#111">OFFLINE · 3 queued</text><text x="1266" y="33.0" font-size="13" text-anchor="end" font-weight="normal" fill="#111">Ana (cashier)  ·  Lock</text><rect x="0" y="56" width="1280" height="744" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1"/><text x="40" y="108" font-size="20" text-anchor="start" font-weight="bold" fill="#111">Open tickets on this terminal</text><text x="40" y="136" font-size="12" text-anchor="start" font-weight="normal" fill="#111">3 open  ·  ₱905 not yet collected</text><rect x="1000" y="92" width="240" height="52" rx="0" fill="#cccccc" stroke="#333" stroke-width="1"/><text x="1120.0" y="122.66666666666667" font-size="14" text-anchor="middle" fill="#111">New order</text><rect x="40" y="168" width="1200" height="78" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="50" y="211.33333333333334" font-size="13" fill="#111">Table 4        4 items      ₱310      open 6 min          [ Resume ]   [ Discard ]</text><rect x="40" y="256" width="1200" height="78" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="50" y="299.3333333333333" font-size="13" fill="#111">Aling Nena     2 items      ₱175      open 14 min         [ Resume ]   [ Discard ]</text><rect x="40" y="344" width="1200" height="78" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="50" y="387.3333333333333" font-size="13" fill="#111">Red shirt      6 items      ₱420      open 31 min         [ Resume ]   [ Discard ]</text><rect x="40" y="440" width="600" height="132" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1" stroke-dasharray="6 4"/><text x="50" y="460" font-size="12" fill="#111">A ticket is a DRAFT with a label.</text><text x="50" y="477" font-size="12" fill="#111"></text><text x="50" y="494" font-size="12" fill="#111">It never leaves this terminal, appears in no report and</text><text x="50" y="511" font-size="12" fill="#111">no total, and reaches the server only when it is paid.</text><rect x="660" y="440" width="580" height="132" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1" stroke-dasharray="6 4"/><text x="670" y="460" font-size="12" fill="#111">Discarding writes NOTHING — no record, no reversal.</text><text x="670" y="477" font-size="12" fill="#111"></text><text x="670" y="494" font-size="12" fill="#111">A void is for a sale that happened. Nothing happened here.</text><rect x="40" y="600" width="1200" height="88" rx="0" fill="#eeeeee" stroke="#333" stroke-width="1"/><text x="50" y="621" font-size="13" fill="#111">The drawer cannot be closed while any ticket is open.</text><text x="50" y="639" font-size="13" fill="#111">Pay it or discard it first — the close screen lists them with both actions.</text>
<text x="0" y="834" font-size="12" fill="#555">· Reached from the sale screen&#x27;s Tickets count. Empty state: this screen says so and offers New order.</text><text x="0" y="854" font-size="12" fill="#555">· AGE IS SHOWN because a ticket open for 40 minutes is usually a customer who left.</text><text x="0" y="874" font-size="12" fill="#555">· Resume opens the draft with its lines and its label intact. It is not a state transition.</text><text x="0" y="894" font-size="12" fill="#555">· Tickets belong to THIS DEVICE. Another terminal shows none of these, by construction (ADR-0011).</text><text x="0" y="914" font-size="12" fill="#555">· Sorted oldest first — the one most likely to be forgotten is at the top.</text>
</g>
</svg>
