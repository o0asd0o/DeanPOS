<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1096" viewBox="0 0 1360 1096" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
<rect width="1360" height="1096" fill="#fafafa"/>
<text x="40" y="34" font-size="17" font-weight="bold" fill="#111">POS · Refund</text>
<text x="40" y="56" font-size="12" fill="#555">pos · tablet landscape 1280x800 · lo-fi: structure and order only — spacing, type, colour and states come from tokens</text>
<g transform="translate(40,78)">
<rect x="0" y="0" width="1280" height="800" fill="#ffffff" stroke="#111" stroke-width="2"/>
<rect x="0" y="0" width="1280" height="56" rx="0" fill="#eeeeee" stroke="#333" stroke-width="1"/><text x="14" y="33.0" font-size="13" text-anchor="start" font-weight="normal" fill="#111">DeanPOS · Malabon · Counter 2</text><rect x="530.0" y="12" width="220" height="32" rx="0" fill="#cccccc" stroke="#333" stroke-width="1"/><text x="640.0" y="32.0" font-size="12" text-anchor="middle" fill="#111">OFFLINE · 3 queued</text><text x="1266" y="33.0" font-size="13" text-anchor="end" font-weight="normal" fill="#111">Ana (cashier)  ·  Lock</text><rect x="0" y="56" width="1280" height="744" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1"/><text x="40" y="104" font-size="20" text-anchor="start" font-weight="bold" fill="#111">Refund — order C1-0388</text><text x="40" y="130" font-size="12" text-anchor="start" font-weight="normal" fill="#111">31 Jul 12:35 · Dina · paid ₱308.00 · senior/PWD 20% applied to the whole bill</text><text x="40" y="176" font-size="12" text-anchor="start" font-weight="normal" fill="#111">What is coming back?</text><rect x="40" y="188" width="760" height="62" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="50" y="223.0" font-size="12" fill="#111">Adobo · Whole   listed ₱240.00   paid ₱192.00    [ − ] 1 of 2 [ + ]     ₱96.00</text><rect x="40" y="258" width="760" height="62" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="50" y="293.0" font-size="12" fill="#111">  + Extra rice ×1  listed ₱15.00   paid ₱12.00     rides with its line</text><rect x="40" y="328" width="760" height="62" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="50" y="363.0" font-size="12" fill="#111">Munggo · Half   listed ₱55.00    paid ₱44.00     [ − ] 0 of 1 [ + ]      ₱0.00</text><rect x="40" y="398" width="760" height="62" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="50" y="433.0" font-size="12" fill="#111">Rice ×2         listed ₱30.00    REFUNDED 30 Jul  nothing left</text><rect x="40" y="468" width="760" height="62" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="50" y="503.0" font-size="12" fill="#111">Softdrink ×1    listed ₱45.00    paid ₱36.00      [ − ] 0 of 1 [ + ]     ₱0.00</text><rect x="40" y="552" width="760" height="130" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1" stroke-dasharray="6 4"/><text x="50" y="572" font-size="12" fill="#111">EACH LINE GIVES BACK WHAT WAS PAID FOR IT, NOT WHAT IT WAS LISTED AT.</text><text x="50" y="589" font-size="12" fill="#111"></text><text x="50" y="606" font-size="12" fill="#111">The ₱77.00 discount came off the whole bill, so a ₱240.00 line was really</text><text x="50" y="623" font-size="12" fill="#111">sold for ₱192.00.  120.00 x (1 - 77/385) = 96.00 for one of the two.</text><text x="50" y="640" font-size="12" fill="#111">Refunding the listed price would cost the tenant the difference, every time.</text><rect x="830" y="140" width="410" height="240" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="840" y="161" font-size="13" fill="#111">REFUND TOTAL</text><text x="840" y="179" font-size="13" fill="#111"></text><text x="840" y="197" font-size="13" fill="#111">₱96.00</text><text x="840" y="215" font-size="13" fill="#111"></text><text x="840" y="233" font-size="13" fill="#111">paid                ₱308.00</text><text x="840" y="251" font-size="13" fill="#111">already refunded     ₱24.00</text><text x="840" y="269" font-size="13" fill="#111">refundable now      ₱284.00</text><text x="840" y="287" font-size="13" fill="#111">left after this     ₱188.00</text><text x="840" y="305" font-size="13" fill="#111">VAT on this refund        —</text><text x="840" y="323" font-size="13" fill="#111">  (the sale recorded none)</text><rect x="830" y="400" width="410" height="130" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="840" y="420" font-size="12" fill="#111">Reason  (required)</text><text x="840" y="437" font-size="12" fill="#111"></text><text x="840" y="454" font-size="12" fill="#111">[ spoiled                          ]</text><rect x="830" y="552" width="410" height="62" rx="0" fill="#eeeeee" stroke="#333" stroke-width="1"/><text x="1035.0" y="587.3333333333334" font-size="13" text-anchor="middle" fill="#111">Manager approval required</text><rect x="830" y="626" width="410" height="56" rx="0" fill="#cccccc" stroke="#333" stroke-width="1"/><text x="1035.0" y="659.6666666666666" font-size="17" text-anchor="middle" fill="#111">REFUND ₱96.00</text><rect x="830" y="700" width="410" height="48" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="1035.0" y="728.3333333333334" font-size="13" text-anchor="middle" fill="#111">Cancel</text>
<text x="0" y="834" font-size="12" fill="#555">· PER LINE, WITH QUANTITY. Returning one of two portions is one action, not a whole-order refund.</text><text x="0" y="854" font-size="12" fill="#555">· The paid column is the line&#x27;s share AFTER a whole-bill discount. That share is what comes back.</text><text x="0" y="874" font-size="12" fill="#555">· A line already fully refunded is shown and disabled — history is visible, not hidden.</text><text x="0" y="894" font-size="12" fill="#555">· Still refundable is computed SERVER-side from persisted rows; the terminal never asserts it.</text><text x="0" y="914" font-size="12" fill="#555">· The refund that clears the order returns the REMAINING BALANCE, so residue is never lost or duplicated.</text><text x="0" y="934" font-size="12" fill="#555">· VAT follows the original sale: the rate captured on the Order, or none where the sale recorded none.</text><text x="0" y="954" font-size="12" fill="#555">· Reason is required, and manager approval opens the same override dialog as a void.</text><text x="0" y="974" font-size="12" fill="#555">· Add-ons ride with their line — they were never separately priced.</text>
</g>
</svg>
