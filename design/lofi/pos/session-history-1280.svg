<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="996" viewBox="0 0 1360 996" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
<rect width="1360" height="996" fill="#fafafa"/>
<text x="40" y="34" font-size="17" font-weight="bold" fill="#111">POS · Session history</text>
<text x="40" y="56" font-size="12" fill="#555">pos · tablet landscape 1280x800 · lo-fi: structure and order only — spacing, type, colour and states come from tokens</text>
<g transform="translate(40,78)">
<rect x="0" y="0" width="1280" height="800" fill="#ffffff" stroke="#111" stroke-width="2"/>
<rect x="0" y="0" width="1280" height="56" rx="0" fill="#eeeeee" stroke="#333" stroke-width="1"/><text x="14" y="33.0" font-size="13" text-anchor="start" font-weight="normal" fill="#111">DeanPOS · Malabon · Counter 2</text><rect x="530.0" y="12" width="220" height="32" rx="0" fill="#cccccc" stroke="#333" stroke-width="1"/><text x="640.0" y="32.0" font-size="12" text-anchor="middle" fill="#111">OFFLINE · 3 queued</text><text x="1266" y="33.0" font-size="13" text-anchor="end" font-weight="normal" fill="#111">Ana (cashier)  ·  Lock</text><text x="40" y="104" font-size="20" text-anchor="start" font-weight="bold" fill="#111">Sessions closed on this terminal</text><text x="40" y="128" font-size="12" text-anchor="start" font-weight="normal" fill="#111">Counter 2 · most recent first · recent window only</text><rect x="40" y="150" width="600" height="64" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="50" y="186.0" font-size="12" fill="#111">07-30  06:55 → 15:20   Ana    counted ₱9,430   −₱50   synced</text><rect x="40" y="224" width="600" height="64" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="50" y="260.0" font-size="12" fill="#111">07-29  06:58 → 15:05   Ana    counted ₱8,910    ₱0    synced</text><rect x="40" y="298" width="600" height="64" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="50" y="334.0" font-size="12" fill="#111">07-28  14:30 → 23:10   Dina   counted ₱7,240   −₱20   PENDING SYNC</text><rect x="40" y="372" width="600" height="64" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="50" y="408.0" font-size="12" fill="#111">07-28  06:52 → 14:25   Ana    counted ₱9,105   +₱15   synced</text><rect x="40" y="456" width="600" height="70" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1" stroke-dasharray="6 4"/><text x="50" y="476" font-size="12" fill="#111">A close still sitting in the Outbox is marked pending — &#x27;did it go through&#x27;</text><text x="50" y="493" font-size="12" fill="#111">is something you can see, not something you assume.</text><rect x="680" y="150" width="560" height="300" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="690" y="171" font-size="13" fill="#111">Selected session  ·  07-30</text><text x="690" y="189" font-size="13" fill="#111"></text><text x="690" y="207" font-size="13" fill="#111">Opened 06:55 by Ana · closed 15:20 by Ana</text><text x="690" y="225" font-size="13" fill="#111">Float                            ₱1,000.00</text><text x="690" y="243" font-size="13" fill="#111">Orders                                  47</text><text x="690" y="261" font-size="13" fill="#111">Cash                             ₱9,180.00</text><text x="690" y="279" font-size="13" fill="#111">GCash / Maya / Card              ₱1,940.00</text><text x="690" y="297" font-size="13" fill="#111"></text><text x="690" y="315" font-size="13" fill="#111">Expected                         ₱9,480.00</text><text x="690" y="333" font-size="13" fill="#111">Counted                          ₱9,430.00</text><text x="690" y="351" font-size="13" fill="#111">Variance                           −₱50.00</text><text x="690" y="369" font-size="13" fill="#111">Approved by Boy · miscount</text><rect x="680" y="470" width="560" height="130" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1" stroke-dasharray="6 4"/><text x="690" y="490" font-size="12" fill="#111">The expected figure obeys the same right here.</text><text x="690" y="507" font-size="12" fill="#111">A cashier without it sees the count and the</text><text x="690" y="524" font-size="12" fill="#111">variance and no expected total.</text><text x="690" y="541" font-size="12" fill="#111"></text><text x="690" y="558" font-size="12" fill="#111">A cashier sees only their own sessions.</text><rect x="680" y="620" width="560" height="102" rx="0" fill="#eeeeee" stroke="#333" stroke-width="1"/><text x="690" y="640" font-size="12" fill="#111">Scoped to THIS DEVICE and a bounded recent window.</text><text x="690" y="657" font-size="12" fill="#111"></text><text x="690" y="674" font-size="12" fill="#111">A terminal is not a reporting surface. Every cross-device,</text><text x="690" y="691" font-size="12" fill="#111">cross-store, or cross-period question is the back-office.</text>
<text x="0" y="834" font-size="12" fill="#555">· Device-scoped server-side — a Device token cannot read another Device&#x27;s sessions.</text><text x="0" y="854" font-size="12" fill="#555">· Sync state per session uses the same vocabulary as the sync-status screen.</text><text x="0" y="874" font-size="12" fill="#555">· Closed sessions are immutable. Nothing on this screen edits anything.</text>
</g>
</svg>
