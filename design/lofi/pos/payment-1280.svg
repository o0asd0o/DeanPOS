<text x="40" y="34" font-size="17" font-weight="bold" fill="#111">POS · Payment</text>
<text x="40" y="56" font-size="12" fill="#555">pos · tablet landscape 1280x800 · lo-fi: structure and order only — spacing, type, colour and states come from tokens</text>
<g transform="translate(40,78)">
<rect x="0" y="0" width="1280" height="800" fill="#ffffff" stroke="#111" stroke-width="2"/>
<rect x="0" y="0" width="1280" height="56" rx="0" fill="#eeeeee" stroke="#333" stroke-width="1"/><text x="14" y="33.0" font-size="13" text-anchor="start" font-weight="normal" fill="#111">DeanPOS · Malabon · Counter 2</text><rect x="530.0" y="12" width="220" height="32" rx="0" fill="#cccccc" stroke="#333" stroke-width="1"/><text x="640.0" y="32.0" font-size="12" text-anchor="middle" fill="#111">OFFLINE · 3 queued</text><text x="1266" y="33.0" font-size="13" text-anchor="end" font-weight="normal" fill="#111">Ana (cashier)  ·  Lock</text><text x="40" y="92" font-size="12" text-anchor="start" font-weight="normal" fill="#111">Amount due</text><rect x="40" y="100" width="290" height="116" rx="0" fill="#eeeeee" stroke="#333" stroke-width="1"/><text x="185.0" y="168.0" font-size="30" text-anchor="middle" fill="#111">₱308.00</text><text x="620" y="92" font-size="12" text-anchor="end" font-weight="normal" fill="#111">Payment method</text><rect x="346" y="100" width="132" height="54" rx="0" fill="#cccccc" stroke="#333" stroke-width="1"/><text x="412.0" y="131.33333333333334" font-size="13" text-anchor="middle" fill="#111">Cash</text><rect x="488" y="100" width="132" height="54" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="554.0" y="131.33333333333334" font-size="13" text-anchor="middle" fill="#111">GCash ⬤</text><rect x="346" y="162" width="132" height="54" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="412.0" y="193.33333333333334" font-size="13" text-anchor="middle" fill="#111">Maya ⬤</text><rect x="488" y="162" width="132" height="54" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="554.0" y="193.33333333333334" font-size="13" text-anchor="middle" fill="#111">Card</text><text x="40" y="250" font-size="13" text-anchor="start" font-weight="normal" fill="#111">Tendered  —  cash only</text><rect x="40" y="262" width="580" height="84" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="330.0" y="312.6666666666667" font-size="26" text-anchor="middle" fill="#111">₱ 500</text><rect x="40" y="396" width="108" height="60" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="94.0" y="430.3333333333333" font-size="13" text-anchor="middle" fill="#111">₱100</text><rect x="158" y="396" width="108" height="60" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="212.0" y="430.3333333333333" font-size="13" text-anchor="middle" fill="#111">₱200</text><rect x="276" y="396" width="108" height="60" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="330.0" y="430.3333333333333" font-size="13" text-anchor="middle" fill="#111">₱500</text><rect x="394" y="396" width="108" height="60" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="448.0" y="430.3333333333333" font-size="13" text-anchor="middle" fill="#111">₱1000</text><rect x="512" y="396" width="108" height="60" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="566.0" y="430.3333333333333" font-size="13" text-anchor="middle" fill="#111">Exact</text><rect x="40" y="474" width="580" height="84" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="330.0" y="509.5" font-size="24" text-anchor="middle" fill="#111">CHANGE</text><text x="330.0" y="538.5" font-size="24" text-anchor="middle" fill="#111">₱192.00</text><rect x="40" y="578" width="580" height="118" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1" stroke-dasharray="6 4"/><text x="50" y="597" font-size="11" fill="#111">Keypad, quick tender, and change are CASH-ONLY controls.</text><text x="50" y="613" font-size="11" fill="#111">A recorded tender asks for one amount and nothing else.</text><text x="50" y="629" font-size="11" fill="#111"></text><text x="50" y="645" font-size="11" fill="#111">A recorded tender authorises nothing — no gateway,</text><text x="50" y="661" font-size="11" fill="#111">no QR, no settlement.</text><rect x="40" y="712" width="285" height="52" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="182.5" y="742.3333333333334" font-size="13" text-anchor="middle" fill="#111">Back to order</text><rect x="660" y="96" width="580" height="424" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="670" y="116" font-size="12" fill="#111">Order summary  (read-only)</text><text x="670" y="133" font-size="12" fill="#111"></text><text x="670" y="150" font-size="12" fill="#111">Adobo · Whole  ×2                     ₱240.00</text><text x="670" y="167" font-size="12" fill="#111">  + Extra rice ×1                      ₱15.00</text><text x="670" y="184" font-size="12" fill="#111">Munggo · Half  ×1                      ₱55.00</text><text x="670" y="201" font-size="12" fill="#111">Rice           ×2                      ₱30.00</text><text x="670" y="218" font-size="12" fill="#111">Softdrink      ×1                      ₱45.00</text><text x="670" y="235" font-size="12" fill="#111">                                ─────────────</text><text x="670" y="252" font-size="12" fill="#111">Subtotal                              ₱385.00</text><text x="670" y="269" font-size="12" fill="#111">Senior citizen / PWD 20%              −₱77.00</text><text x="670" y="286" font-size="12" fill="#111">  ref SC-0099213 (Senior ID)</text><text x="670" y="303" font-size="12" fill="#111">VAT — exempt on this sale                   —</text><text x="670" y="320" font-size="12" fill="#111">                                ─────────────</text><text x="670" y="337" font-size="12" fill="#111">AMOUNT DUE                            ₱308.00</text><rect x="660" y="548" width="580" height="216" rx="0" fill="#cccccc" stroke="#333" stroke-width="1"/><text x="950.0" y="663.3333333333334" font-size="22" text-anchor="middle" fill="#111">COMPLETE SALE</text>
<text x="0" y="834" font-size="12" fill="#555">· METHOD SITS AT THE TOP, level with the amount due. How are you paying is asked BEFORE the keypad, not after.</text><text x="0" y="854" font-size="12" fill="#555">· The method row is the TENANT&#x27;S list. A cash-only tenant — the default — sees no chooser at all.</text><text x="0" y="874" font-size="12" fill="#555">· GCASH AND MAYA CARRY THEIR OWN MARK AND BRAND COLOUR — GCash blue, Maya black. Every other method is a plain chip.</text><text x="0" y="894" font-size="12" fill="#555">· Those marks come from each provider&#x27;s OFFICIAL BRAND KIT. Never redrawn, never a colour eyeballed from a screenshot.</text><text x="0" y="914" font-size="12" fill="#555">· Branding must not imply an integration. The authorises-nothing copy stays exactly where it is, for that reason.</text><text x="0" y="934" font-size="12" fill="#555">· Only cash asks for a tendered amount and computes change. A recorded tender is a typed amount, no change.</text><text x="0" y="954" font-size="12" fill="#555">· Nothing here authorises anything. The copy must make that unmistakable or a tenant will assume otherwise.</text><text x="0" y="974" font-size="12" fill="#555">· Cash below the total cannot complete — the primary action is disabled, not warned after.</text><text x="0" y="994" font-size="12" fill="#555">· The VAT and discount lines are both conditional. Neither renders as a zero when absent.</text><text x="0" y="1014" font-size="12" fill="#555">· COMPLETE SALE is idempotent on the order UUID: a double tap yields one sale.</text><text x="0" y="1034" font-size="12" fill="#555">· Back to order returns to the cart with the basket intact — it is not a void.</text>
</g>
</svg>
