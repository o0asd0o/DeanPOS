<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="996" viewBox="0 0 1360 996" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
<rect width="1360" height="996" fill="#fafafa"/>
<text x="40" y="34" font-size="17" font-weight="bold" fill="#111">POS · Sync status</text>
<text x="40" y="56" font-size="12" fill="#555">pos · tablet landscape 1280x800 · lo-fi: structure and order only — spacing, type, colour and states come from tokens</text>
<g transform="translate(40,78)">
<rect x="0" y="0" width="1280" height="800" fill="#ffffff" stroke="#111" stroke-width="2"/>
<rect x="0" y="0" width="1280" height="56" rx="0" fill="#eeeeee" stroke="#333" stroke-width="1"/><text x="14" y="33.0" font-size="13" text-anchor="start" font-weight="normal" fill="#111">DeanPOS · Malabon · Counter 2</text><rect x="530.0" y="12" width="220" height="32" rx="0" fill="#cccccc" stroke="#333" stroke-width="1"/><text x="640.0" y="32.0" font-size="12" text-anchor="middle" fill="#111">OFFLINE · 3 queued</text><text x="1266" y="33.0" font-size="13" text-anchor="end" font-weight="normal" fill="#111">Ana (cashier)  ·  Lock</text><text x="40" y="104" font-size="20" text-anchor="start" font-weight="bold" fill="#111">Sync</text><rect x="40" y="124" width="600" height="120" rx="0" fill="#eeeeee" stroke="#333" stroke-width="1"/><text x="50" y="146" font-size="14" fill="#111">OFFLINE since 12:02  (39 min)</text><text x="50" y="165" font-size="14" fill="#111">3 sales queued · oldest 31 min</text><text x="50" y="184" font-size="14" fill="#111">Last successful sync 12:02</text><rect x="40" y="264" width="600" height="60" rx="0" fill="#cccccc" stroke="#333" stroke-width="1"/><text x="340.0" y="299.0" font-size="15" text-anchor="middle" fill="#111">SYNC NOW</text><text x="40" y="372" font-size="13" text-anchor="start" font-weight="normal" fill="#111">Queued</text><rect x="40" y="386" width="600" height="56" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="50" y="418.0" font-size="12" fill="#111">order   C2-0421   ₱310.00   12:41   attempt 4</text><rect x="40" y="450" width="600" height="56" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="50" y="482.0" font-size="12" fill="#111">order   C2-0422   ₱95.00    12:52   attempt 3</text><rect x="40" y="514" width="600" height="56" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="50" y="546.0" font-size="12" fill="#111">void    C2-0419              12:55   attempt 3</text><rect x="680" y="124" width="560" height="200" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1" stroke-dasharray="6 4"/><text x="960.0" y="201.33333333333334" font-size="13" text-anchor="middle" fill="#111">Nothing is ever discarded.</text><text x="960.0" y="219.33333333333334" font-size="13" text-anchor="middle" fill="#111"></text><text x="960.0" y="237.33333333333334" font-size="13" text-anchor="middle" fill="#111">A queued sale retries until the server</text><text x="960.0" y="255.33333333333334" font-size="13" text-anchor="middle" fill="#111">acknowledges it. Retries back off; they do not stop.</text><rect x="680" y="348" width="560" height="80" rx="0" fill="#eeeeee" stroke="#333" stroke-width="1"/><text x="690" y="368" font-size="12" fill="#111">⚠ Sales have been stuck for over 30 minutes.</text><text x="690" y="385" font-size="12" fill="#111">Tell a manager before closing up.</text><rect x="680" y="452" width="560" height="80" rx="0" fill="#ffffff" stroke="#333" stroke-width="1" stroke-dasharray="6 4"/><text x="690" y="472" font-size="12" fill="#111">⛔ This terminal has been revoked.</text><text x="690" y="489" font-size="12" fill="#111">Queued sales are held for review — do not clear them.</text><rect x="680" y="556" width="560" height="80" rx="0" fill="#ffffff" stroke="#333" stroke-width="1" stroke-dasharray="6 4"/><text x="690" y="576" font-size="12" fill="#111">Storage is not persistent on this device.</text><text x="690" y="593" font-size="12" fill="#111">Queued sales could be evicted — tell the operator.</text>
<text x="0" y="834" font-size="12" fill="#555">· Reachable from the top-bar pill on every screen.</text><text x="0" y="854" font-size="12" fill="#555">· The three dashed panels are states, not stacked content: stalled, revoked, non-persistent storage.</text><text x="0" y="874" font-size="12" fill="#555">· There is no &#x27;clear queue&#x27; control anywhere, by design.</text>
</g>
</svg>
