<text x="40" y="34" font-size="17" font-weight="bold" fill="#111">POS · Set aside as a ticket</text>
<text x="40" y="56" font-size="12" fill="#555">pos · tablet landscape 1280x800 · lo-fi: structure and order only — spacing, type, colour and states come from tokens</text>
<g transform="translate(40,78)">
<rect x="0" y="0" width="1280" height="800" fill="#ffffff" stroke="#111" stroke-width="2"/>
<rect x="0" y="0" width="1280" height="56" rx="0" fill="#eeeeee" stroke="#333" stroke-width="1"/><text x="14" y="33.0" font-size="13" text-anchor="start" font-weight="normal" fill="#111">DeanPOS · Malabon · Counter 2</text><rect x="530.0" y="12" width="220" height="32" rx="0" fill="#cccccc" stroke="#333" stroke-width="1"/><text x="640.0" y="32.0" font-size="12" text-anchor="middle" fill="#111">OFFLINE · 3 queued</text><text x="1266" y="33.0" font-size="13" text-anchor="end" font-weight="normal" fill="#111">Ana (cashier)  ·  Lock</text><rect x="0" y="56" width="1280" height="744" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1" stroke-dasharray="6 4"/><rect x="310.0" y="193.0" width="660" height="470" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="326.0" y="229.0" font-size="16" text-anchor="start" font-weight="bold" fill="#111">Set this order aside</text><text x="326.0" y="255.0" font-size="12" text-anchor="start" font-weight="normal" fill="#111">Order C2-0421 · 4 items · ₱310</text><text x="326.0" y="293.0" font-size="11" text-anchor="start" font-weight="normal" fill="#111">Table  —  this Store&#x27;s list</text><rect x="326.0" y="303.0" width="148" height="44" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="400.0" y="329.0" font-size="12" text-anchor="middle" fill="#111">Table 1</text><rect x="482.0" y="303.0" width="148" height="44" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="556.0" y="329.0" font-size="12" text-anchor="middle" fill="#111">Table 2</text><rect x="638.0" y="303.0" width="148" height="44" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="712.0" y="329.0" font-size="12" text-anchor="middle" fill="#111">Table 4</text><rect x="794.0" y="303.0" width="148" height="44" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="868.0" y="329.0" font-size="12" text-anchor="middle" fill="#111">Table 6</text><rect x="326.0" y="355.0" width="148" height="44" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="400.0" y="381.0" font-size="12" text-anchor="middle" fill="#111">Takeout</text><rect x="482.0" y="355.0" width="148" height="44" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="556.0" y="381.0" font-size="12" text-anchor="middle" fill="#111">Table 7</text><rect x="638.0" y="355.0" width="148" height="44" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="712.0" y="381.0" font-size="12" text-anchor="middle" fill="#111">Table 8</text><text x="326.0" y="451.0" font-size="11" text-anchor="start" font-weight="normal" fill="#111">Tables 3 and 5 and Counter are not listed — they already have a ticket</text><rect x="326.0" y="461.0" width="628" height="74" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="336.0" y="481.0" font-size="12" fill="#111">Or type a label</text><text x="336.0" y="498.0" font-size="12" fill="#111"></text><text x="336.0" y="515.0" font-size="12" fill="#111">[ Aling Nena                                    ]</text><rect x="326.0" y="595.0" width="309.0" height="52" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="480.5" y="625.3333333333334" font-size="13" text-anchor="middle" fill="#111">Cancel</text><rect x="645.0" y="595.0" width="309.0" height="52" rx="0" fill="#cccccc" stroke="#333" stroke-width="1"/><text x="799.5" y="625.3333333333334" font-size="13" text-anchor="middle" fill="#111">Set aside</text>
<text x="0" y="834" font-size="12" fill="#555">· TABLE LIST IS OPTIONAL AND EMPTY BY DEFAULT. With no tables configured, only the free-text field renders.</text><text x="0" y="854" font-size="12" fill="#555">· OCCUPIED LABELS ARE NOT OFFERED — one open ticket per table (Loyverse §2.14.2, ADR-0011).</text><text x="0" y="874" font-size="12" fill="#555">· A table is a LABEL with no stored state. Occupied is derived from this Device&#x27;s open tickets.</text><text x="0" y="894" font-size="12" fill="#555">· A label may be a customer&#x27;s name — it is personal data, shown and exported, never logged.</text><text x="0" y="914" font-size="12" fill="#555">· Setting aside clears the cart for the next customer. It is not a void and writes nothing to the server.</text>
</g>
</svg>
