<text x="0" y="834" font-size="12" fill="#555">· Tapping a MenuItem replaces the tile grid in place — same grid, one level down.</text><text x="0" y="854" font-size="12" fill="#555">· This is why Variants are a grid and not a list in a modal: there can be a dozen, and this scrolls.</text><text x="0" y="874" font-size="12" fill="#555">· The cart stays visible; drilling in is not a mode the cashier can get lost in.</text><text x="0" y="894" font-size="12" fill="#555">· &#x27;‹ Ulam&#x27; returns to the top-level grid. Choosing a category also exits the drill-down.</text><text x="0" y="914" font-size="12" fill="#555">· A MenuItem with exactly one Variant SKIPS this screen entirely.</text>
