<text x="0" y="834" font-size="12" fill="#555">· OPTIONAL SCREEN. A tenant with no Discounts configured has no discount control anywhere — this never renders.</text><text x="0" y="854" font-size="12" fill="#555">· The list is the tenant&#x27;s own. Nothing here is automatic, conditional, or scheduled: a person chooses it.</text><text x="0" y="874" font-size="12" fill="#555">· A Discount requiring a reference cannot apply until the reference is entered. The label is tenant-set.</text><text x="0" y="894" font-size="12" fill="#555">· A restricted Discount opens the manager override dialog before it applies.</text><text x="0" y="914" font-size="12" fill="#555">· A line-scoped Discount asks which line. Amount discounts are whole-order only and skip that step.</text><text x="0" y="934" font-size="12" fill="#555">· This is NOT the manual price override, which stays separate and always manager-gated.</text>
