<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="996" viewBox="0 0 1360 996" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
<rect width="1360" height="996" fill="#fafafa"/>
<text x="40" y="34" font-size="17" font-weight="bold" fill="#111">POS · Device enrolment</text>
<text x="40" y="56" font-size="12" fill="#555">pos · tablet landscape 1280x800 · lo-fi: structure and order only — spacing, type, colour and states come from tokens</text>
<g transform="translate(40,78)">
<rect x="0" y="0" width="1280" height="800" fill="#ffffff" stroke="#111" stroke-width="2"/>
<rect x="0" y="0" width="1280" height="800" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1"/><text x="640.0" y="140" font-size="22" text-anchor="middle" font-weight="bold" fill="#111">Enrol this terminal</text><text x="640.0" y="172" font-size="12" text-anchor="middle" font-weight="normal" fill="#111">An admin generates a code in the back-office. It is single-use and short-lived.</text><text x="400" y="250" font-size="13" text-anchor="start" font-weight="normal" fill="#111">Enrolment code</text><rect x="400" y="262" width="480" height="70" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="640.0" y="305.0" font-size="24" text-anchor="middle" fill="#111">F 4 K 9  —  2 X 7 M</text><text x="400" y="372" font-size="13" text-anchor="start" font-weight="normal" fill="#111">Name this terminal</text><rect x="400" y="384" width="480" height="52" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="410" y="414.3333333333333" font-size="13" fill="#111">Counter 2</text><rect x="400" y="462" width="480" height="74" rx="0" fill="#eeeeee" stroke="#333" stroke-width="1"/><text x="640.0" y="494.5" font-size="12" text-anchor="middle" fill="#111">Store: Malabon</text><text x="640.0" y="511.5" font-size="12" text-anchor="middle" fill="#111">(resolved from the code — not chosen here)</text><rect x="400" y="566" width="480" height="64" rx="0" fill="#cccccc" stroke="#333" stroke-width="1"/><text x="640.0" y="603.6666666666666" font-size="17" text-anchor="middle" fill="#111">ENROL</text><rect x="400" y="654" width="480" height="40" rx="0" fill="#ffffff" stroke="#333" stroke-width="1" stroke-dasharray="6 4"/><text x="640.0" y="678.0" font-size="12" text-anchor="middle" fill="#111">Code expired or already used</text>
<text x="0" y="834" font-size="12" fill="#555">· Store comes from the code — never chosen on the device.</text><text x="0" y="854" font-size="12" fill="#555">· Runs once per terminal; the resulting token survives restarts and outages.</text><text x="0" y="874" font-size="12" fill="#555">· The dashed strip is the failure state: expired, consumed, or unknown code.</text>
</g>
</svg>
