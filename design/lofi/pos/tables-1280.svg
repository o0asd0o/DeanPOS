items · ₱310</text><text x="780.0" y="263.33333333333337" font-size="13" text-anchor="middle" fill="#111">6 min</text><rect x="940" y="176" width="280" height="130" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="1080.0" y="236.33333333333334" font-size="13" text-anchor="middle" fill="#111">Table 4</text><text x="1080.0" y="254.33333333333334" font-size="13" text-anchor="middle" fill="#111">free</text><rect x="40" y="326" width="280" height="130" rx="0" fill="#cccccc" stroke="#333" stroke-width="1"/><text x="180.0" y="377.3333333333333" font-size="13" text-anchor="middle" fill="#111">Table 5</text><text x="180.0" y="395.3333333333333" font-size="13" text-anchor="middle" fill="#111">6 items · ₱420</text><text x="180.0" y="413.3333333333333" font-size="13" text-anchor="middle" fill="#111">31 min</text><rect x="340" y="326" width="280" height="130" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="480.0" y="386.3333333333333" font-size="13" text-anchor="middle" fill="#111">Table 6</text><text x="480.0" y="404.3333333333333" font-size="13" text-anchor="middle" fill="#111">free</text><rect x="640" y="326" width="280" height="130" rx="0" fill="#cccccc" stroke="#333" stroke-width="1"/><text x="780.0" y="377.3333333333333" font-size="13" text-anchor="middle" fill="#111">Counter</text><text x="780.0" y="395.3333333333333" font-size="13" text-anchor="middle" fill="#111">2 items · ₱175</text><text x="780.0" y="413.3333333333333" font-size="13" text-anchor="middle" fill="#111">14 min</text><rect x="940" y="326" width="280" height="130" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="1080.0" y="386.3333333333333" font-size="13" text-anchor="middle" fill="#111">Takeout</text><text x="1080.0" y="404.3333333333333" font-size="13" text-anchor="middle" fill="#111">free</text><rect x="40" y="500" width="1200" height="34" rx="0" fill="#eeeeee" stroke="#333" stroke-width="1"/><text x="50" y="521.0" font-size="12" fill="#111">Other open tickets  —  labels typed at the counter</text><rect x="40" y="542" width="1200" height="58" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="50" y="575.0" font-size="12" fill="#111">Aling Nena        3 items      ₱240      open 8 min       [ Resume ]  [ Move… ]  [ Discard ]</text><rect x="40" y="608" width="1200" height="58" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="50" y="641.0" font-size="12" fill="#111">Red shirt         1 item        ₱85      open 22 min      [ Resume ]  [ Move… ]  [ Discard ]</text><rect x="40" y="676" width="1200" height="96" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1" stroke-dasharray="6 4"/><text x="50" y="696" font-size="12" fill="#111">A TABLE IS A LABEL. Nothing is stored on it — occupied means an open ticket on this terminal carries that label.</text><text x="50" y="713" font-size="12" fill="#111">No floor plan, no seating, no covers, no turn time. This is the comparison product&#x27;s predefined-ticket model (Loyverse §2.14), not a table-service system.</text>
<text x="0" y="834" font-size="12" fill="#555">· SAME ROUTE AS `tickets-1280`, in the configuration where the Store HAS table labels. Not a second screen.</text><text x="0" y="854" font-size="12" fill="#555">· With no table labels configured — the default — the grid is absent entirely and this is the plain ticket list.</text><text x="0" y="874" font-size="12" fill="#555">· A free tile starts a new order already labelled. An occupied tile resumes its ticket.</text><text x="0" y="894" font-size="12" fill="#555">· An occupied label is NOT offered when labelling another order — one open ticket per table (Loyverse §2.14.2).</text><text x="0" y="914" font-size="12" fill="#555">· Occupancy is DERIVED from this Device&#x27;s open tickets. Another terminal&#x27;s tickets are invisible, so its tables read free.</text><text x="0" y="934" font-size="12" fill="#555">· Move… changes a ticket&#x27;s label. Split and merge are deliberately absent — both are shared-draft operations.</text>
</g>
</svg>
