<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1136" viewBox="0 0 1360 1136" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
<rect width="1360" height="1136" fill="#fafafa"/>
<text x="40" y="34" font-size="17" font-weight="bold" fill="#111">POS · Order lookup</text>
<text x="40" y="56" font-size="12" fill="#555">pos · tablet landscape 1280x800 · lo-fi: structure and order only — spacing, type, colour and states come from tokens</text>
<g transform="translate(40,78)">
<rect x="0" y="0" width="1280" height="800" fill="#ffffff" stroke="#111" stroke-width="2"/>
<rect x="0" y="0" width="1280" height="56" rx="0" fill="#eeeeee" stroke="#333" stroke-width="1"/><text x="14" y="33.0" font-size="13" text-anchor="start" font-weight="normal" fill="#111">DeanPOS · Malabon · Counter 2</text><rect x="530.0" y="12" width="220" height="32" rx="0" fill="#cccccc" stroke="#333" stroke-width="1"/><text x="640.0" y="32.0" font-size="12" text-anchor="middle" fill="#111">OFFLINE · 3 queued</text><text x="1266" y="33.0" font-size="13" text-anchor="end" font-weight="normal" fill="#111">Ana (cashier)  ·  Lock</text><text x="40" y="104" font-size="20" text-anchor="start" font-weight="bold" fill="#111">Recent orders on this terminal</text><text x="40" y="126" font-size="12" text-anchor="start" font-weight="normal" fill="#111">this drawer session and the previous two business days</text><rect x="40" y="140" width="600" height="46" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="50" y="167.33333333333334" font-size="13" fill="#111">Search order number…</text><text x="40" y="210" font-size="11" text-anchor="start" font-weight="normal" fill="#111">Rung up by</text><rect x="40" y="218" width="122" height="40" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="101.0" y="242.0" font-size="12" text-anchor="middle" fill="#111">Anyone</text><rect x="170" y="218" width="122" height="40" rx="0" fill="#cccccc" stroke="#333" stroke-width="1"/><text x="231.0" y="242.0" font-size="12" text-anchor="middle" fill="#111">Ana</text><rect x="300" y="218" width="122" height="40" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="361.0" y="242.0" font-size="12" text-anchor="middle" fill="#111">Boy</text><rect x="40" y="274" width="600" height="56" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="50" y="306.0" font-size="12" fill="#111">C2-0421   12:41   ₱310.00   Ana   synced</text><rect x="40" y="338" width="600" height="56" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="50" y="370.0" font-size="12" fill="#111">C2-0420   12:33   ₱145.00   Ana   queued</text><rect x="40" y="402" width="600" height="56" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="50" y="434.0" font-size="12" fill="#111">C2-0419   12:20   ₱210.00   Ana   VOIDED</text><rect x="40" y="466" width="600" height="56" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="50" y="498.0" font-size="12" fill="#111">C2-0418   12:11   ₱80.00    Ana   synced</text><rect x="680" y="140" width="560" height="300" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1" stroke-dasharray="6 4"/><text x="960.0" y="266.1666666666667" font-size="14" text-anchor="middle" fill="#111">Selected order</text><text x="960.0" y="285.1666666666667" font-size="14" text-anchor="middle" fill="#111"></text><text x="960.0" y="304.1666666666667" font-size="14" text-anchor="middle" fill="#111">(receipt view, read-only,</text><text x="960.0" y="323.1666666666667" font-size="14" text-anchor="middle" fill="#111">with Void / Refund actions)</text><rect x="680" y="460" width="560" height="224" rx="0" fill="#eeeeee" stroke="#333" stroke-width="1"/><text x="690" y="479" font-size="11" fill="#111">NOT ON THIS TERMINAL — three worded outcomes</text><text x="690" y="495" font-size="11" fill="#111"></text><text x="690" y="511" font-size="11" fill="#111">  online, found    opens here, same Void / Refund actions</text><text x="690" y="527" font-size="11" fill="#111">  online, no row   &quot;not found in this store — it may still</text><text x="690" y="543" font-size="11" fill="#111">                   be waiting to sync on the terminal that</text><text x="690" y="559" font-size="11" fill="#111">                   rang it&quot;</text><text x="690" y="575" font-size="11" fill="#111">  offline          &quot;not rung on this terminal — reconnect</text><text x="690" y="591" font-size="11" fill="#111">                   to find it&quot;</text><text x="690" y="607" font-size="11" fill="#111"></text><text x="690" y="623" font-size="11" fill="#111">Never blank. A cashier reads blank as a fake receipt.</text>
<text x="0" y="834" font-size="12" fill="#555">· Scoped to this Device — order numbers are unique per Device, not per Store.</text><text x="0" y="854" font-size="12" fill="#555">· READS THE RECENT-ORDERS STORE, NOT THE OUTBOX. The Outbox empties on sync; a lookup built on it would lose a sale the moment the terminal caught up.</text><text x="0" y="874" font-size="12" fill="#555">· The window is stated on screen: this DrawerSession plus the previous two business days.</text><text x="0" y="894" font-size="12" fill="#555">· A number not held locally FALLS BACK TO A STORE-WIDE SEARCH — and says so honestly when offline.</text><text x="0" y="914" font-size="12" fill="#555">· That fallback is only safe because a Device code is unique within its Store (tenancy-identity).</text><text x="0" y="934" font-size="12" fill="#555">· Sync state is visible per order.</text><text x="0" y="954" font-size="12" fill="#555">· Selecting an order opens the receipt view; corrections start from there.</text><text x="0" y="974" font-size="12" fill="#555">· RUNG UP BY lists only the Users who actually used this terminal in the window — not the Store&#x27;s directory.</text><text x="0" y="994" font-size="12" fill="#555">· It filters on the User attributed to the Order, whatever their Role. A manager&#x27;s own sales are in the list.</text><text x="0" y="1014" font-size="12" fill="#555">· Defaults to the signed-in User after a handover, because &#x27;find mine&#x27; is the reason the filter exists.</text>
</g>
</svg>
