<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1056" viewBox="0 0 1360 1056" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
<rect width="1360" height="1056" fill="#fafafa"/>
<text x="40" y="34" font-size="17" font-weight="bold" fill="#111">POS · Running summary (open session)</text>
<text x="40" y="56" font-size="12" fill="#555">pos · tablet landscape 1280x800 · lo-fi: structure and order only — spacing, type, colour and states come from tokens</text>
<g transform="translate(40,78)">
<rect x="0" y="0" width="1280" height="800" fill="#ffffff" stroke="#111" stroke-width="2"/>
<rect x="0" y="0" width="1280" height="56" rx="0" fill="#eeeeee" stroke="#333" stroke-width="1"/><text x="14" y="33.0" font-size="13" text-anchor="start" font-weight="normal" fill="#111">DeanPOS · Malabon · Counter 2</text><rect x="530.0" y="12" width="220" height="32" rx="0" fill="#cccccc" stroke="#333" stroke-width="1"/><text x="640.0" y="32.0" font-size="12" text-anchor="middle" fill="#111">OFFLINE · 3 queued</text><text x="1266" y="33.0" font-size="13" text-anchor="end" font-weight="normal" fill="#111">Ana (cashier)  ·  Lock</text><text x="40" y="104" font-size="20" text-anchor="start" font-weight="bold" fill="#111">Drawer session · OPEN</text><text x="40" y="128" font-size="12" text-anchor="start" font-weight="normal" fill="#111">opened 06:58 by Ana · Malabon · Counter 2 · 5h 43m</text><rect x="40" y="148" width="580" height="300" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="50" y="169" font-size="13" fill="#111">Float declared                          ₱1,000.00</text><text x="50" y="187" font-size="13" fill="#111"></text><text x="50" y="205" font-size="13" fill="#111">Orders taken                                    41</text><text x="50" y="223" font-size="13" fill="#111"></text><text x="50" y="241" font-size="13" fill="#111">Cash                                     ₱8,480.00</text><text x="50" y="259" font-size="13" fill="#111">GCash                                      ₱890.00</text><text x="50" y="277" font-size="13" fill="#111">Maya                                       ₱260.00</text><text x="50" y="295" font-size="13" fill="#111">Card                                     ₱1,150.00</text><text x="50" y="313" font-size="13" fill="#111"></text><text x="50" y="331" font-size="13" fill="#111">Refunds (cash)                            −₱175.00</text><text x="50" y="349" font-size="13" fill="#111">Cash in                                    ₱250.00</text><text x="50" y="367" font-size="13" fill="#111">Cash out                                  −₱200.00</text><rect x="40" y="466" width="580" height="76" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1" stroke-dasharray="6 4"/><text x="50" y="486" font-size="12" fill="#111">Non-cash methods are shown but never reach the drawer.</text><text x="50" y="503" font-size="12" fill="#111">A busy GCash day is not a till about to come up short.</text><rect x="40" y="566" width="285" height="56" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="182.5" y="598.3333333333334" font-size="13" text-anchor="middle" fill="#111">Cash movement</text><rect x="335" y="566" width="285" height="56" rx="0" fill="#cccccc" stroke="#333" stroke-width="1"/><text x="477.5" y="598.3333333333334" font-size="13" text-anchor="middle" fill="#111">Close session</text><rect x="40" y="646" width="580" height="76" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1" stroke-dasharray="6 4"/><text x="50" y="666" font-size="12" fill="#111">Reading this screen writes nothing. It does not close, mark,</text><text x="50" y="683" font-size="12" fill="#111">or touch the session — and it works with no network.</text><rect x="660" y="148" width="580" height="240" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="670" y="169" font-size="13" fill="#111">WITH the right to see expected cash</text><text x="670" y="187" font-size="13" fill="#111"></text><text x="670" y="205" font-size="13" fill="#111">EXPECTED CASH                    ₱9,355.00</text><text x="670" y="223" font-size="13" fill="#111"></text><text x="670" y="241" font-size="13" fill="#111">= float + cash − cash refunds</text><text x="670" y="259" font-size="13" fill="#111">  + cash in − cash out</text><text x="670" y="277" font-size="13" fill="#111"></text><text x="670" y="295" font-size="13" fill="#111">A manager checking where the till stands</text><text x="670" y="313" font-size="13" fill="#111">at 3pm, before anybody counts anything.</text><rect x="660" y="408" width="580" height="240" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1" stroke-dasharray="6 4"/><text x="670" y="429" font-size="13" fill="#111">WITHOUT it — the cashier&#x27;s view</text><text x="670" y="447" font-size="13" fill="#111"></text><text x="670" y="465" font-size="13" fill="#111">EXPECTED CASH                            —</text><text x="670" y="483" font-size="13" fill="#111">                          not shown, and</text><text x="670" y="501" font-size="13" fill="#111">                          NOT IN THE PAYLOAD</text><text x="670" y="519" font-size="13" fill="#111"></text><text x="670" y="537" font-size="13" fill="#111">Everything above stays visible. Only the</text><text x="670" y="555" font-size="13" fill="#111">expected figure is withheld, by the same</text><text x="670" y="573" font-size="13" fill="#111">right that governs the close-time reveal.</text><rect x="660" y="668" width="580" height="54" rx="0" fill="#eeeeee" stroke="#333" stroke-width="1"/><text x="670" y="687" font-size="11" fill="#111">One right, one secret. A second permission for the same number is how</text><text x="670" y="703" font-size="11" fill="#111">a control gets widened by accident.</text>
<text x="0" y="834" font-size="12" fill="#555">· The two right-hand panels are the SAME screen for two people, not two panels stacked.</text><text x="0" y="854" font-size="12" fill="#555">· This is the second route to the expected total and therefore the second place the blind count can be defeated.</text><text x="0" y="874" font-size="12" fill="#555">· Withholding it in the UI while shipping it in the payload is not withholding it.</text><text x="0" y="894" font-size="12" fill="#555">· Computed on the device from the orders it holds, so it works offline.</text><text x="0" y="914" font-size="12" fill="#555">· Read-only. There is no action here that changes the session except the two buttons, which are existing flows.</text><text x="0" y="934" font-size="12" fill="#555">· No printing — there is no receipt printer in v1.</text>
</g>
</svg>
