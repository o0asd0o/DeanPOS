<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1056" viewBox="0 0 1360 1056" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
<rect width="1360" height="1056" fill="#fafafa"/>
<text x="40" y="34" font-size="17" font-weight="bold" fill="#111">POS · Receipt</text>
<text x="40" y="56" font-size="12" fill="#555">pos · tablet landscape 1280x800 · lo-fi: structure and order only — spacing, type, colour and states come from tokens</text>
<g transform="translate(40,78)">
<rect x="0" y="0" width="1280" height="800" fill="#ffffff" stroke="#111" stroke-width="2"/>
<rect x="0" y="0" width="1280" height="56" rx="0" fill="#eeeeee" stroke="#333" stroke-width="1"/><text x="14" y="33.0" font-size="13" text-anchor="start" font-weight="normal" fill="#111">DeanPOS · Malabon · Counter 2</text><rect x="530.0" y="12" width="220" height="32" rx="0" fill="#cccccc" stroke="#333" stroke-width="1"/><text x="640.0" y="32.0" font-size="12" text-anchor="middle" fill="#111">ONLINE · synced</text><text x="1266" y="33.0" font-size="13" text-anchor="end" font-weight="normal" fill="#111">Ana (cashier)  ·  Lock</text><rect x="340" y="88" width="600" height="610" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="640" y="130" font-size="20" text-anchor="middle" font-weight="bold" fill="#111">SALE COMPLETE</text><text x="640" y="158" font-size="12" text-anchor="middle" font-weight="normal" fill="#111">Order C2-0421 · 2026-07-31 12:41</text><text x="640" y="180" font-size="12" text-anchor="middle" font-weight="normal" fill="#111">Malabon · Counter 2 · Ana</text><rect x="360" y="200" width="560" height="200" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="370" y="220" font-size="12" fill="#111">Adobo · Whole  ×1                       ₱120</text><text x="370" y="237" font-size="12" fill="#111">   + Extra rice ×1                       ₱15</text><text x="370" y="254" font-size="12" fill="#111">Munggo · Half  ×2                       ₱140</text><text x="370" y="271" font-size="12" fill="#111">Softdrinks  ×1                            ₱35</text><rect x="360" y="412" width="560" height="128" rx="0" fill="#eeeeee" stroke="#333" stroke-width="1"/><text x="370" y="432" font-size="12" fill="#111">Subtotal                                 ₱310.00</text><text x="370" y="449" font-size="12" fill="#111">Senior citizen / PWD 20%                 −₱62.00</text><text x="370" y="466" font-size="12" fill="#111">VAT (12%)                                  ₱26.57</text><text x="370" y="483" font-size="12" fill="#111">TOTAL                                       ₱248.00</text><text x="370" y="500" font-size="12" fill="#111">Cash · tendered ₱500.00      change ₱252.00</text><rect x="360" y="550" width="560" height="30" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1" stroke-dasharray="6 4"/><text x="640.0" y="568.6666666666666" font-size="11" text-anchor="middle" fill="#111">the discount and VAT lines are each CONDITIONAL — absent, not zero</text><rect x="360" y="592" width="270" height="46" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="495.0" y="619.0" font-size="12" text-anchor="middle" fill="#111">Void order (manager)</text><rect x="650" y="592" width="270" height="46" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="785.0" y="619.0" font-size="12" text-anchor="middle" fill="#111">Refund (manager)</text><rect x="360" y="650" width="560" height="48" rx="0" fill="#cccccc" stroke="#333" stroke-width="1"/><text x="640.0" y="679.6666666666666" font-size="17" text-anchor="middle" fill="#111">NEW ORDER</text>
<text x="0" y="834" font-size="12" fill="#555">· On-screen only — there is no printer in v1.</text><text x="0" y="854" font-size="12" fill="#555">· VAT is backed out of the total, never added — and only when the tenant is VAT-registered.</text><text x="0" y="874" font-size="12" fill="#555">· A non-VAT tenant&#x27;s receipt has no VAT line at all. It must not imply a registration they lack.</text><text x="0" y="894" font-size="12" fill="#555">· A discount prints with its name; a VAT-exempt one removes the VAT line for that sale.</text><text x="0" y="914" font-size="12" fill="#555">· Void and Refund are visible here but require a manager Override.</text><text x="0" y="934" font-size="12" fill="#555">· NEW ORDER is one tap: the queue keeps moving.</text>
</g>
</svg>
