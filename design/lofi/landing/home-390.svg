">Half, plus add-ons.</text><rect x="20" y="672" width="350" height="130" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="30" y="692" font-size="12" fill="#111">THE DAY ADDS UP</text><text x="30" y="709" font-size="12" fill="#111"></text><text x="30" y="726" font-size="12" fill="#111">Float, count, variance,</text><text x="30" y="743" font-size="12" fill="#111">and who approved it.</text><rect x="20" y="830" width="350" height="200" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1" stroke-dasharray="6 4"/><text x="195.0" y="934.0" font-size="12" text-anchor="middle" fill="#111">screenshot of the sale screen</text><rect x="20" y="1060" width="350" height="220" rx="0" fill="#eeeeee" stroke="#333" stroke-width="1"/><text x="30" y="1080" font-size="12" fill="#111">WHAT IT DOES NOT DO</text><text x="30" y="1097" font-size="12" fill="#111"></text><text x="30" y="1114" font-size="12" fill="#111">No card processing</text><text x="30" y="1131" font-size="12" fill="#111">No accounting / e-invoicing</text><text x="30" y="1148" font-size="12" fill="#111">No loyalty or promos</text><text x="30" y="1165" font-size="12" fill="#111">No purchasing or stock</text><text x="30" y="1182" font-size="12" fill="#111">No dine-in tables</text><text x="30" y="1199" font-size="12" fill="#111">No printed receipts yet</text><rect x="20" y="1310" width="350" height="320" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="30" y="1330" font-size="12" fill="#111">Join the waitlist</text><text x="30" y="1347" font-size="12" fill="#111"></text><text x="30" y="1364" font-size="12" fill="#111">[ Your name              ]</text><text x="30" y="1381" font-size="12" fill="#111">[ Business name          ]</text><text x="30" y="1398" font-size="12" fill="#111">[ Email or mobile        ]</text><text x="30" y="1415" font-size="12" fill="#111">[ City                   ]</text><text x="30" y="1432" font-size="12" fill="#111">[ Anything else?         ]</text><text x="30" y="1449" font-size="12" fill="#111"></text><text x="30" y="1466" font-size="12" fill="#111">[         JOIN          ]</text><text x="30" y="1483" font-size="12" fill="#111"></text><text x="30" y="1500" font-size="12" fill="#111">We reply personally.</text><rect x="0" y="1820" width="390" height="80" rx="0" fill="#eeeeee" stroke="#333" stroke-width="1"/><text x="195.0" y="1855.6666666666667" font-size="11" text-anchor="middle" fill="#111">DeanPOS · Premium Softwares</text><text x="195.0" y="1871.6666666666667" font-size="11" text-anchor="middle" fill="#111">how we handle your data · contact</text>
