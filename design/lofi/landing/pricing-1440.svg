<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="1776" viewBox="0 0 1520 1776" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
<rect width="1520" height="1776" fill="#fafafa"/>
<text x="40" y="34" font-size="17" font-weight="bold" fill="#111">Landing · Pricing</text>
<text x="40" y="56" font-size="12" fill="#555">landing · desktop 1440 · lo-fi: structure and order only — spacing, type, colour and states come from tokens</text>
<g transform="translate(40,78)">
<rect x="0" y="0" width="1440" height="1600" fill="#ffffff" stroke="#111" stroke-width="2"/>
<rect x="0" y="0" width="1440" height="64" rx="0" fill="#eeeeee" stroke="#333" stroke-width="1"/><text x="40" y="37.0" font-size="15" text-anchor="start" font-weight="bold" fill="#111">DeanPOS</text><text x="1400" y="37.0" font-size="13" text-anchor="end" font-weight="normal" fill="#111">What it does   ·   Pricing   ·   Join the waitlist</text><text x="720.0" y="150" font-size="32" text-anchor="middle" font-weight="bold" fill="#111">Pricing</text><text x="720.0" y="186" font-size="15" text-anchor="middle" font-weight="normal" fill="#111">One plan. No card processing fees, because we do not touch the card.</text><rect x="460.0" y="230" width="520" height="320" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="720.0" y="309.1666666666667" font-size="14" text-anchor="middle" fill="#111">PER STORE / MONTH</text><text x="720.0" y="328.1666666666667" font-size="14" text-anchor="middle" fill="#111"></text><text x="720.0" y="347.1666666666667" font-size="14" text-anchor="middle" fill="#111">₱ —</text><text x="720.0" y="366.1666666666667" font-size="14" text-anchor="middle" fill="#111"></text><text x="720.0" y="385.1666666666667" font-size="14" text-anchor="middle" fill="#111">Unlimited terminals at that store</text><text x="720.0" y="404.1666666666667" font-size="14" text-anchor="middle" fill="#111">Unlimited staff accounts</text><text x="720.0" y="423.1666666666667" font-size="14" text-anchor="middle" fill="#111">Offline selling · drawer reconciliation</text><text x="720.0" y="442.1666666666667" font-size="14" text-anchor="middle" fill="#111">Reports and CSV export</text><text x="720.0" y="461.1666666666667" font-size="14" text-anchor="middle" fill="#111"></text><text x="720.0" y="480.1666666666667" font-size="14" text-anchor="middle" fill="#111">[  Join the waitlist  ]</text><rect x="460.0" y="580" width="520" height="90" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1" stroke-dasharray="6 4"/><text x="720.0" y="620.5" font-size="12" text-anchor="middle" fill="#111">Pricing is not final while we are onboarding by hand.</text><text x="720.0" y="637.5" font-size="12" text-anchor="middle" fill="#111">It will be stated here before self-serve signup exists.</text><text x="200" y="740" font-size="18" text-anchor="start" font-weight="bold" fill="#111">Questions people actually ask</text><rect x="200" y="764" width="1040" height="84" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="210" y="810.3333333333334" font-size="13" fill="#111">Does it work without internet?    Yes — the terminal sells offline and syncs when it reconnects.</text><rect x="200" y="860" width="1040" height="84" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="210" y="906.3333333333334" font-size="13" fill="#111">Can it charge a credit card?      No. A card amount can be recorded; DeanPOS does not process it.</text><rect x="200" y="956" width="1040" height="84" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="210" y="1002.3333333333334" font-size="13" fill="#111">Is this BIR compliant?            No. DeanPOS produces business reports, not statutory ones.</text><rect x="200" y="1052" width="1040" height="84" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="210" y="1098.3333333333333" font-size="13" fill="#111">Can I move my data out?           Yes. You can export everything you have put in.</text><rect x="200" y="1148" width="1040" height="84" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="210" y="1194.3333333333333" font-size="13" fill="#111">What if I stop using it?          Export first, then we delete your data on request.</text><rect x="200" y="1300" width="1040" height="160" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="210" y="1321" font-size="13" fill="#111">Join the waitlist</text><text x="210" y="1339" font-size="13" fill="#111"></text><text x="210" y="1357" font-size="13" fill="#111">[ Name ]  [ Business ]  [ Email or mobile ]  [ City ]     [  JOIN  ]</text><text x="210" y="1375" font-size="13" fill="#111"></text><text x="210" y="1393" font-size="13" fill="#111">We reply personally. No newsletter, no drip sequence.</text><rect x="0" y="1540" width="1440" height="60" rx="0" fill="#eeeeee" stroke="#333" stroke-width="1"/><text x="720.0" y="1574.0" font-size="12" text-anchor="middle" fill="#111">DeanPOS · Premium Softwares · how we handle your data · contact</text>
<text x="0" y="1634" font-size="12" fill="#555">· The BIR answer is deliberately blunt — it is the claim most likely to be misread.</text><text x="0" y="1654" font-size="12" fill="#555">· Export and deletion are answered here because they are the questions a cautious owner asks.</text>
</g>
</svg>
