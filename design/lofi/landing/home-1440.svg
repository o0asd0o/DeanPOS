<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="1816" viewBox="0 0 1520 1816" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
<rect width="1520" height="1816" fill="#fafafa"/>
<text x="40" y="34" font-size="17" font-weight="bold" fill="#111">Landing · Home</text>
<text x="40" y="56" font-size="12" fill="#555">landing · desktop 1440 · lo-fi: structure and order only — spacing, type, colour and states come from tokens</text>
<g transform="translate(40,78)">
<rect x="0" y="0" width="1440" height="1600" fill="#ffffff" stroke="#111" stroke-width="2"/>
<rect x="0" y="0" width="1440" height="64" rx="0" fill="#eeeeee" stroke="#333" stroke-width="1"/><text x="40" y="37.0" font-size="15" text-anchor="start" font-weight="bold" fill="#111">DeanPOS</text><text x="1400" y="37.0" font-size="13" text-anchor="end" font-weight="normal" fill="#111">What it does   ·   Pricing   ·   Join the waitlist</text><rect x="0" y="64" width="1440" height="380" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1"/><text x="720.0" y="190" font-size="34" text-anchor="middle" font-weight="bold" fill="#111">A point-of-sale for counter-service food</text><text x="720.0" y="232" font-size="16" text-anchor="middle" font-weight="normal" fill="#111">Built for carinderias and fast-casual. Keeps selling when the internet drops.</text><rect x="510.0" y="280" width="200" height="56" rx="0" fill="#cccccc" stroke="#333" stroke-width="1"/><text x="610.0" y="312.6666666666667" font-size="14" text-anchor="middle" fill="#111">Join the waitlist</text><rect x="730.0" y="280" width="200" height="56" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="830.0" y="312.6666666666667" font-size="14" text-anchor="middle" fill="#111">See pricing</text><text x="720.0" y="384" font-size="12" text-anchor="middle" font-weight="normal" fill="#111">₱ prices · VAT optional · one deploy, many restaurants</text><rect x="120" y="490" width="380" height="220" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="310.0" y="568.3333333333334" font-size="13" text-anchor="middle" fill="#111">SELLS OFFLINE</text><text x="310.0" y="586.3333333333334" font-size="13" text-anchor="middle" fill="#111"></text><text x="310.0" y="604.3333333333334" font-size="13" text-anchor="middle" fill="#111">The till keeps working with no</text><text x="310.0" y="622.3333333333334" font-size="13" text-anchor="middle" fill="#111">network. Sales queue and sync</text><text x="310.0" y="640.3333333333334" font-size="13" text-anchor="middle" fill="#111">when it comes back.</text><rect x="560" y="490" width="380" height="220" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="750.0" y="568.3333333333334" font-size="13" text-anchor="middle" fill="#111">YOUR MENU, YOUR WAY</text><text x="750.0" y="586.3333333333334" font-size="13" text-anchor="middle" fill="#111"></text><text x="750.0" y="604.3333333333334" font-size="13" text-anchor="middle" fill="#111">Ulam → Adobo / Munggo →</text><text x="750.0" y="622.3333333333334" font-size="13" text-anchor="middle" fill="#111">Whole / Half, plus add-ons</text><text x="750.0" y="640.3333333333334" font-size="13" text-anchor="middle" fill="#111">like extra rice.</text><rect x="1000" y="490" width="380" height="220" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="1190.0" y="568.3333333333334" font-size="13" text-anchor="middle" fill="#111">THE DAY ADDS UP</text><text x="1190.0" y="586.3333333333334" font-size="13" text-anchor="middle" fill="#111"></text><text x="1190.0" y="604.3333333333334" font-size="13" text-anchor="middle" fill="#111">Open a drawer with a float,</text><text x="1190.0" y="622.3333333333334" font-size="13" text-anchor="middle" fill="#111">count it at close, see the</text><text x="1190.0" y="640.3333333333334" font-size="13" text-anchor="middle" fill="#111">variance and who approved it.</text><rect x="120" y="750" width="1200" height="300" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="160" y="800" font-size="18" text-anchor="start" font-weight="bold" fill="#111">The terminal</text><rect x="160" y="820" width="560" height="200" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1" stroke-dasharray="6 4"/><text x="440.0" y="915.3333333333334" font-size="13" text-anchor="middle" fill="#111">screenshot of the sale screen</text><text x="440.0" y="933.3333333333334" font-size="13" text-anchor="middle" fill="#111">(tablet)</text><rect x="760" y="820" width="520" height="200" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="770" y="841" font-size="13" fill="#111">Fast entry, big targets, works</text><text x="770" y="859" font-size="13" fill="#111">on a tablet or a phone.</text><text x="770" y="877" font-size="13" fill="#111"></text><text x="770" y="895" font-size="13" fill="#111">Manager approval for voids,</text><text x="770" y="913" font-size="13" fill="#111">refunds and discounts.</text><rect x="120" y="1090" width="1200" height="200" rx="0" fill="#eeeeee" stroke="#333" stroke-width="1"/><text x="130" y="1111" font-size="13" fill="#111">WHAT IT DOES NOT DO</text><text x="130" y="1129" font-size="13" fill="#111"></text><text x="130" y="1147" font-size="13" fill="#111">No card processing · no accounting or e-invoicing · no loyalty or promos</text><text x="130" y="1165" font-size="13" fill="#111">No purchasing or stock counts · no dine-in tables · no printed receipts yet</text><text x="130" y="1183" font-size="13" fill="#111"></text><text x="130" y="1201" font-size="13" fill="#111">Published on purpose. Better to know now than after onboarding.</text><rect x="120" y="1330" width="700" height="200" rx="0" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="130" y="1351" font-size="13" fill="#111">Join the waitlist</text><text x="130" y="1369" font-size="13" fill="#111"></text><text x="130" y="1387" font-size="13" fill="#111">[ Your name                    ]</text><text x="130" y="1405" font-size="13" fill="#111">[ Business name                ]</text><text x="130" y="1423" font-size="13" fill="#111">[ Email or mobile              ]</text><text x="130" y="1441" font-size="13" fill="#111">[ City ]   [ Anything else? (optional) ]</text><text x="130" y="1459" font-size="13" fill="#111"></text><text x="130" y="1477" font-size="13" fill="#111">[  JOIN  ]     We reply personally. No newsletter.</text><rect x="860" y="1330" width="460" height="200" rx="0" fill="#f7f7f7" stroke="#333" stroke-width="1" stroke-dasharray="6 4"/><text x="870" y="1350" font-size="12" fill="#111">Not a signup form.</text><text x="870" y="1367" font-size="12" fill="#111"></text><text x="870" y="1384" font-size="12" fill="#111">There is no self-serve account yet —</text><text x="870" y="1401" font-size="12" fill="#111">we set each restaurant up ourselves.</text><rect x="0" y="1540" width="1440" height="60" rx="0" fill="#eeeeee" stroke="#333" stroke-width="1"/><text x="720.0" y="1574.0" font-size="12" text-anchor="middle" fill="#111">DeanPOS · Premium Softwares · how we handle your data · contact</text>
<text x="0" y="1634" font-size="12" fill="#555">· The two questions that decide the purchase are answered above the fold: does it work offline, can my staff use it.</text><text x="0" y="1654" font-size="12" fill="#555">· The non-goals block is a feature, not a disclaimer — do not soften it.</text><text x="0" y="1674" font-size="12" fill="#555">· No claim of tax compliance anywhere on the site.</text><text x="0" y="1694" font-size="12" fill="#555">· The waitlist form is the only unauthenticated write in the whole product.</text>
</g>
</svg>
