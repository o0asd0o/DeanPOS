services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-deanpos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-deanpos}
      POSTGRES_DB: ${POSTGRES_DB:-DeanPOS_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-deanpos}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
